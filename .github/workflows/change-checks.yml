name: Change checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: change-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect component changes
    runs-on: ubuntu-latest
    outputs:
      center: ${{ steps.filter.outputs.center }}
      agent: ${{ steps.filter.outputs.agent }}
      console: ${{ steps.filter.outputs.console }}
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == 'workflow_dispatch' ]]; then
            printf 'center=true\nagent=true\nconsole=true\ncontract=true\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          for component in center agent console contract; do
            value="$(python3 scripts/detect-component-changes.py "${component}" --base "${BASE_SHA}" --head "${SHA}")"
            echo "${component}=${value}" >> "${GITHUB_OUTPUT}"
          done

  repository-hygiene:
    name: Repository hygiene
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan tracked files without echoing matches
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/scan-repository-secrets.sh
          python3 scripts/verify-agent-boundaries.py
          python3 -m unittest scripts/test_verify_release.py
          python3 -m unittest scripts/test_verify_release_recovery.py
          python3 -m unittest scripts/test_detect_component_changes.py
          python3 -m unittest scripts/test_prepare_component_release.py
          python3 -m unittest scripts/test_push_gitops_component.py
      - name: Enforce event-driven wait paths
        shell: bash
        run: bash scripts/check-event-driven.sh
      - name: Validate public Java production overlay template
        shell: bash
        run: bash scripts/validate-java-production-overlay.sh --template
      - name: Validate single MCP model surface
        run: node scripts/check-mcp-tool-surface.mjs
      - name: Browser tool contract tests
        run: node --test scripts/browser-worker.test.mjs

  browser-runtime:
    name: Browser runtime gate
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    uses: ./.github/workflows/browser-runtime-check.yml

  center-test:
    name: Center selective test
    needs: changes
    if: needs.changes.outputs.center == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: remote_connect_mcp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d remote_connect_mcp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RCM_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/remote_connect_mcp
      RCM_TEST_POSTGRES_USERNAME: postgres
      RCM_TEST_POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: bash scripts/sync-artifact-viewer.sh
      - name: Center tests
        working-directory: java
        run: bash ./gradlew :center:test --no-daemon

  agent-test:
    name: Agent selective test
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Agent, Desktop and Browser tests
        working-directory: java
        run: bash ./gradlew :agent:test :desktop:test :browser:test --no-daemon

  console-test:
    name: Console selective test
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v10.15.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Console build
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build

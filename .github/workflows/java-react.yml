name: Java and React selective CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-react-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect component changes
    runs-on: ubuntu-latest
    outputs:
      center: ${{ steps.filter.outputs.center }}
      agent: ${{ steps.filter.outputs.agent }}
      console: ${{ steps.filter.outputs.console }}
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == 'workflow_dispatch' ]]; then
            printf 'center=true\nagent=true\nconsole=true\ncontract=true\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${EVENT_NAME}" == 'pull_request' ]]; then
            files="$(git diff --name-only "${BASE_SHA}" "${SHA}")"
          elif [[ -z "${BEFORE}" || "${BEFORE}" =~ ^0+$ ]]; then
            files="$(git ls-files)"
          else
            files="$(git diff --name-only "${BEFORE}" "${SHA}")"
          fi
          center=false; agent=false; console=false; contract=false
          if printf '%s\n' "${files}" | grep -Eq '^(java/center/|web/src/artifact-viewer/|scripts/sync-artifact-viewer.sh)'; then center=true; fi
          if printf '%s\n' "${files}" | grep -Eq '^(java/(agent|desktop|browser)/|scripts/(install-java-agent|first-install-java-agent|deploy-java-desktop-browser|browser-worker))'; then agent=true; fi
          if printf '%s\n' "${files}" | grep -Eq '^(web/)'; then console=true; fi
          if printf '%s\n' "${files}" | grep -Eq '^(java/protocol/|java/(build.gradle.kts|settings.gradle.kts|gradle.properties)$|java/gradle/|java/gradlew(\.bat)?$)'; then
            contract=true; center=true; agent=true
          fi
          printf 'center=%s\nagent=%s\nconsole=%s\ncontract=%s\n' "${center}" "${agent}" "${console}" "${contract}" >> "${GITHUB_OUTPUT}"

  repository-hygiene:
    name: Repository hygiene
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan tracked files without echoing matches
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/scan-repository-secrets.sh
          python3 scripts/verify-agent-boundaries.py
      - name: Enforce event-driven wait paths
        shell: bash
        run: bash scripts/check-event-driven.sh
      - name: Validate public Java production overlay template
        shell: bash
        run: bash scripts/validate-java-production-overlay.sh --template
      - name: Validate single MCP model surface
        run: node scripts/check-mcp-tool-surface.mjs

  center-test:
    name: Center selective test
    needs: changes
    if: needs.changes.outputs.center == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: remote_connect_mcp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d remote_connect_mcp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RCM_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/remote_connect_mcp
      RCM_TEST_POSTGRES_USERNAME: postgres
      RCM_TEST_POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: bash scripts/sync-artifact-viewer.sh
      - name: Center tests
        working-directory: java
        run: bash ./gradlew :center:test --no-daemon

  agent-test:
    name: Agent selective test
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Agent, Desktop and Browser tests
        working-directory: java
        run: bash ./gradlew :agent:test :desktop:test :browser:test --no-daemon

  console-test:
    name: Console selective test
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v10.15.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Console build
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build

name: Java and React migration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan tracked files without echoing matches
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/scan-repository-secrets.sh

  jvm-and-console:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Java tests and JVM packages (Unix)
        if: matrix.os != 'windows-latest'
        working-directory: java
        run: bash ./gradlew test :center:bootJar :agent:jar --no-daemon
      - name: Java tests and JVM packages (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: java
        shell: pwsh
        run: .\gradlew.bat test :center:bootJar :agent:jar --no-daemon
      - name: Install React dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build React production bundle
        working-directory: web
        run: pnpm build
      - name: Validate browser worker syntax
        run: node --check scripts/browser-worker.mjs

  native-linux:
    # Build and execute the binary on a matching host.  The release workflow
    # uses the same matrix, so PRs exercise the same architecture boundary.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: false
      - name: Native Image smoke build
        working-directory: java
        # Native Image is memory intensive; compile one image at a time on the
        # hosted runner instead of letting Gradle launch Center and Agent in
        # parallel. This keeps the CI gate deterministic on 16 GiB runners.
        run: bash ./gradlew :center:nativeCompile :agent:nativeCompile --no-daemon --no-parallel
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Native MCP smoke tests
        env:
          CENTER_BINARY: java/center/build/native/nativeCompile/rcm-center
          AGENT_BINARY: java/agent/build/native/nativeCompile/rcm-agent
        run: |
          chmod +x "$CENTER_BINARY" "$AGENT_BINARY"
          RCM_SMOKE_PORT=18180 bash scripts/smoke-java.sh "$CENTER_BINARY"
          RCM_SMOKE_RESOURCE_REPORT="$RUNNER_TEMP/rcm-agent-resource.json" \
            bash scripts/smoke-java-agent.sh "$CENTER_BINARY" "$AGENT_BINARY" 18181
          bash scripts/smoke-java-websocket.sh "$CENTER_BINARY" 18182
      - name: Upload Agent resource report
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-agent-resource-${{ matrix.arch }}
          path: ${{ runner.temp }}/rcm-agent-resource.json
          if-no-files-found: error

  postgres-integration:
    name: PostgreSQL and Liquibase integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: remote_connect_mcp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d remote_connect_mcp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RCM_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/remote_connect_mcp
      RCM_TEST_POSTGRES_USERNAME: postgres
      RCM_TEST_POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run PostgreSQL contract test
        working-directory: java
        run: bash ./gradlew :center:test --tests '*PostgresIntegrationTest' --no-daemon
      - name: PostgreSQL backup and restore gate
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: remote_connect_mcp
          PGUSER: postgres
          PGPASSWORD: postgres
          RCM_BACKUP_OUTPUT_DIR: ${{ runner.temp }}/rcm-backups
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          bash ./scripts/backup-postgres.sh
          dump="$(find "${RCM_BACKUP_OUTPUT_DIR}" -maxdepth 1 -name '*.dump' -print -quit)"
          test -n "${dump}"
          pg_restore --list "${dump}" >/dev/null
          restore_db=remote_connect_mcp_restore
          dropdb --if-exists --host "${PGHOST}" --port "${PGPORT}" --username "${PGUSER}" "${restore_db}"
          createdb --host "${PGHOST}" --port "${PGPORT}" --username "${PGUSER}" "${restore_db}"
          pg_restore --exit-on-error --no-owner --no-acl --host "${PGHOST}" --port "${PGPORT}" --username "${PGUSER}" --dbname "${restore_db}" "${dump}"
          test "$(psql --host "${PGHOST}" --port "${PGPORT}" --username "${PGUSER}" --dbname "${restore_db}" -Atqc "SELECT to_regclass('public.rcm_agent')")" = 'rcm_agent'
          dropdb --if-exists --host "${PGHOST}" --port "${PGPORT}" --username "${PGUSER}" "${restore_db}"

name: Java Native Release

on:
  push:
    branches: [main]
    tags: ["java-v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: java-release-${{ github.ref }}
  # Main-branch previews are immutable but disposable; cancel an older
  # preview when a newer commit arrives.  A java-vX.Y.Z tag is never canceled.
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.coordinates.outputs.version }}
      tag: ${{ steps.coordinates.outputs.tag }}
      publish: ${{ steps.coordinates.outputs.publish }}
      prerelease: ${{ steps.coordinates.outputs.prerelease }}
      verify_tag: ${{ steps.coordinates.outputs.verify_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/scan-repository-secrets.sh
          python3 scripts/verify-agent-boundaries.py
          bash scripts/validate-java-production-overlay.sh --template
      - name: Resolve release coordinates
        id: coordinates
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ "${REF_NAME}" == java-v* ]]; then
            version="${REF_NAME#java-}"
            tag="${REF_NAME}"
            publish=true
            prerelease=false
            verify_tag=true
          elif [[ "${EVENT_NAME}" == "push" && "${REF_TYPE}" == "branch" && "${REF_NAME}" == "main" ]]; then
            # Every accepted main push becomes a selectable, immutable
            # preview.  Stable production releases still use java-vX.Y.Z
            # tags; previews never move the GHCR latest tag.
            version="v0.0.0-main.${RUN_NUMBER}"
            tag="java-${version}"
            publish=true
            prerelease=true
            verify_tag=false
          else
            echo 'This workflow only runs automatically on main or a java-v* tag' >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "verify_tag=${verify_tag}" >> "${GITHUB_OUTPUT}"

  jvm-and-console:
    needs: prepare
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: remote_connect_mcp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d remote_connect_mcp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RCM_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/remote_connect_mcp
      RCM_TEST_POSTGRES_USERNAME: postgres
      RCM_TEST_POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sync standalone MCP Apps artifact viewer
        run: bash scripts/sync-artifact-viewer.sh
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Java tests
        working-directory: java
        run: bash ./gradlew test --no-daemon
      - name: PostgreSQL and Liquibase integration gate
        working-directory: java
        run: bash ./gradlew :center:test --tests '*PostgresIntegrationTest' --no-daemon
      - name: PostgreSQL backup and restore gate
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: remote_connect_mcp
          PGUSER: postgres
          PGPASSWORD: postgres
          RCM_BACKUP_OUTPUT_DIR: ${{ runner.temp }}/rcm-backups
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          bash ./scripts/backup-postgres.sh
          dump="$(find "${RCM_BACKUP_OUTPUT_DIR}" -maxdepth 1 -name '*.dump' -print -quit)"
          test -n "${dump}"
          pg_restore --list "${dump}" >/dev/null
          restore_db=remote_connect_mcp_restore
          dropdb --if-exists --host "${PGHOST}" --port "${PGPORT}" --username "${PGUSER}" "${restore_db}"
          createdb --host "${PGHOST}" --port "${PGPORT}" --username "${PGUSER}" "${restore_db}"
          pg_restore --exit-on-error --no-owner --no-acl --host "${PGHOST}" --port "${PGPORT}" --username "${PGUSER}" --dbname "${restore_db}" "${dump}"
          test "$(psql --host "${PGHOST}" --port "${PGPORT}" --username "${PGUSER}" --dbname "${restore_db}" -Atqc "SELECT to_regclass('public.rcm_agent')")" = 'rcm_agent'
          dropdb --if-exists --host "${PGHOST}" --port "${PGPORT}" --username "${PGUSER}" "${restore_db}"
      - name: React production build
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Validate browser worker syntax
        run: node --check scripts/browser-worker.mjs

  linux-native:
    needs: [prepare, jvm-and-console]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build and execute each Linux artifact on a runner with the same
          # architecture.  This keeps the native smoke tests honest; an
          # arm64 ELF must not be started directly by an amd64 shell.
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: remote_connect_mcp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d remote_connect_mcp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sync standalone MCP Apps artifact viewer
        run: bash scripts/sync-artifact-viewer.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build target Linux Native Images
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          native_march="x86-64-v2"
          if [[ "${TARGET_ARCH}" == "arm64" ]]; then native_march="armv8-a"; fi
          sudo apt-get update
          sudo apt-get install -y zip
          mkdir -p "out/${TARGET_ARCH}"
          docker buildx build --platform "linux/${TARGET_ARCH}" --target artifact \
            --build-arg RCM_CI_BUILD=true \
            --build-arg RCM_NATIVE_MARCH="${native_march}" \
            --file java/Dockerfile.center.native --output "type=local,dest=out/center-${TARGET_ARCH}" java
          docker buildx build --platform "linux/${TARGET_ARCH}" --target artifact \
            --build-arg RCM_CI_BUILD=true \
            --build-arg RCM_NATIVE_MARCH="${native_march}" \
            --file java/Dockerfile.agent.native --output "type=local,dest=out/agent-${TARGET_ARCH}" java
          docker buildx build --platform "linux/${TARGET_ARCH}" --target artifact \
            --build-arg RCM_CI_BUILD=true \
            --build-arg RCM_NATIVE_MARCH="${native_march}" \
            --file java/Dockerfile.desktop.native --output "type=local,dest=out/desktop-${TARGET_ARCH}" java
          docker buildx build --platform "linux/${TARGET_ARCH}" --target artifact \
            --build-arg RCM_CI_BUILD=true \
            --build-arg RCM_NATIVE_MARCH="${native_march}" \
            --file java/Dockerfile.browser.native --output "type=local,dest=out/browser-${TARGET_ARCH}" java
          center="$(find "out/center-${TARGET_ARCH}" -type f -name rcm-center -print -quit)"
          agent="$(find "out/agent-${TARGET_ARCH}" -type f -name rcm-agent -print -quit)"
          desktop="$(find "out/desktop-${TARGET_ARCH}" -type f -name rcm-desktop-companion -print -quit)"
          browser="$(find "out/browser-${TARGET_ARCH}" -type f -name rcm-browser-agent -print -quit)"
          test -n "${center}" && test -n "${agent}" && test -n "${desktop}" && test -n "${browser}"
          # GraalVM may preserve the build runner's x86 ISA-needed note even
          # when -march=x86-64-v2 was selected. Normalize only that note before
          # packaging; the checked-in parser leaves all other ELF properties
          # untouched and fails the build if a v3/v4 marker remains.
          if [[ "${TARGET_ARCH}" == "amd64" ]]; then
            python3 scripts/normalize-native-isa.py --normalize \
              "${center}" "${agent}" "${desktop}" "${browser}"
          fi
          python3 scripts/normalize-native-isa.py --check \
            "${center}" "${agent}" "${desktop}" "${browser}"
          center_bundle="out/${TARGET_ARCH}/center"
          agent_bundle="out/${TARGET_ARCH}/agent"
          desktop_bundle="out/${TARGET_ARCH}/desktop"
          browser_bundle="out/${TARGET_ARCH}/browser"
          mkdir -p "${center_bundle}" "${agent_bundle}" "${desktop_bundle}" "${browser_bundle}"
          cp "${center}" "${center_bundle}/rcm-center"
          cp "${agent}" "${agent_bundle}/rcm-agent"
          cp "${desktop}" "${desktop_bundle}/rcm-desktop-companion"
          cp "${browser}" "${browser_bundle}/rcm-browser-agent"
          # Java Desktop may emit libawt/libfontmanager and other shared
          # objects. Keep each executable with its own runtime libraries and
          # never merge Center/Agent files with the same SONAME.
          find "$(dirname "${center}")" -maxdepth 1 -type f \( -name '*.so' -o -name '*.so.*' \) -exec cp -f {} "${center_bundle}/" \;
          find "$(dirname "${agent}")" -maxdepth 1 -type f \( -name '*.so' -o -name '*.so.*' \) -exec cp -f {} "${agent_bundle}/" \;
          find "$(dirname "${desktop}")" -maxdepth 1 -type f \( -name '*.so' -o -name '*.so.*' \) -exec cp -f {} "${desktop_bundle}/" \;
          find "$(dirname "${browser}")" -maxdepth 1 -type f \( -name '*.so' -o -name '*.so.*' \) -exec cp -f {} "${browser_bundle}/" \;
          cp "${center}" "out/${TARGET_ARCH}/rcm-center"
          cp "${agent}" "out/${TARGET_ARCH}/rcm-agent"
          cp "${desktop}" "out/${TARGET_ARCH}/rcm-desktop-companion"
          cp "${browser}" "out/${TARGET_ARCH}/rcm-browser-agent"
          cp scripts/install-java-agent.sh scripts/first-install-java-agent.sh deploy/systemd/remote-connect-mcp-agent.service deploy/systemd/agent.env.example README.md LICENSE NOTICE "out/${TARGET_ARCH}/"
          chmod +x "out/${TARGET_ARCH}/rcm-center" "out/${TARGET_ARCH}/rcm-agent" "${center_bundle}/rcm-center" "${agent_bundle}/rcm-agent" "out/${TARGET_ARCH}/install-java-agent.sh" "out/${TARGET_ARCH}/first-install-java-agent.sh"
          chmod +x "out/${TARGET_ARCH}/rcm-desktop-companion" "${desktop_bundle}/rcm-desktop-companion"
          chmod +x "out/${TARGET_ARCH}/rcm-browser-agent" "${browser_bundle}/rcm-browser-agent"
          (cd "${center_bundle}" && sha256sum $(find . -maxdepth 1 -type f -printf '%f\n' | sort) > SHA256SUMS)
          (cd "${agent_bundle}" && sha256sum $(find . -maxdepth 1 -type f -printf '%f\n' | sort) > SHA256SUMS)
          (cd "${desktop_bundle}" && sha256sum $(find . -maxdepth 1 -type f -printf '%f\n' | sort) > SHA256SUMS)
          (cd "${browser_bundle}" && sha256sum $(find . -maxdepth 1 -type f -printf '%f\n' | sort) > SHA256SUMS)
          # Verify the actual target binaries, not only the JVM build or the
          # image assembly.  The second smoke test exercises one-time
          # enrollment, identity-only restart and a real command round trip.
          RCM_SMOKE_PORT=18183 bash scripts/smoke-java.sh "${center_bundle}/rcm-center"
          RCM_SMOKE_RESOURCE_REPORT="${RUNNER_TEMP}/rcm-agent-resource-${TARGET_ARCH}.json" \
            bash scripts/smoke-java-agent.sh "${center_bundle}/rcm-center" "${agent_bundle}/rcm-agent" 18184
          bash scripts/smoke-java-websocket.sh "${center_bundle}/rcm-center" 18185
          RCM_AGENT_MAX_RSS_MIB=256 python3 scripts/check-agent-resource-report.py "${RUNNER_TEMP}/rcm-agent-resource-${TARGET_ARCH}.json"
          agent_archive="remote-connect-mcp-agent-${RELEASE_VERSION}-linux-${TARGET_ARCH}.zip"
          desktop_archive="remote-connect-mcp-desktop-${RELEASE_VERSION}-linux-${TARGET_ARCH}.zip"
          browser_archive="remote-connect-mcp-browser-${RELEASE_VERSION}-linux-${TARGET_ARCH}.zip"
          center_archive="remote-connect-mcp-center-${RELEASE_VERSION}-linux-${TARGET_ARCH}.zip"
          agent_files=$(cd "${agent_bundle}" && find . -maxdepth 1 -type f \( -name 'rcm-agent' -o -name '*.so' -o -name '*.so.*' \) -printf '%f\n' | sort)
          center_files=$(cd "${center_bundle}" && find . -maxdepth 1 -type f \( -name 'rcm-center' -o -name '*.so' -o -name '*.so.*' \) -printf '%f\n' | sort)
          desktop_files=$(cd "${desktop_bundle}" && find . -maxdepth 1 -type f \( -name 'rcm-desktop-companion' -o -name '*.so' -o -name '*.so.*' \) -printf '%f\n' | sort)
          browser_files=$(cd "${browser_bundle}" && find . -maxdepth 1 -type f \( -name 'rcm-browser-agent' -o -name '*.so' -o -name '*.so.*' \) -printf '%f\n' | sort)
          # Native binaries compress well; use maximum ZIP deflate without
          # changing the flat bundle layout consumed by the installers.
          (cd "${agent_bundle}" && zip -q -9 -j "${GITHUB_WORKSPACE}/${agent_archive}" ${agent_files})
          (cd "${center_bundle}" && zip -q -9 -j "${GITHUB_WORKSPACE}/${center_archive}" ${center_files})
          (cd "${desktop_bundle}" && zip -q -9 -j "${GITHUB_WORKSPACE}/${desktop_archive}" ${desktop_files})
          (cd "${browser_bundle}" && zip -q -9 -j "${GITHUB_WORKSPACE}/${browser_archive}" ${browser_files})
          sha256sum "${agent_archive}" > "${agent_archive}.sha256"
          sha256sum "${center_archive}" > "${center_archive}.sha256"
          sha256sum "${desktop_archive}" > "${desktop_archive}.sha256"
          sha256sum "${browser_archive}" > "${browser_archive}.sha256"
          bash scripts/verify-native-bundle.sh "${agent_archive}"
          bash scripts/verify-native-bundle.sh "${desktop_archive}" rcm-desktop-companion
          bash scripts/verify-native-bundle.sh "${browser_archive}" rcm-browser-agent
          tar -C "out" -I 'gzip -9' -cf "remote-connect-mcp-${RELEASE_VERSION}-linux-${TARGET_ARCH}.tar.gz" "${TARGET_ARCH}"
          sha256sum "remote-connect-mcp-${RELEASE_VERSION}-linux-${TARGET_ARCH}.tar.gz" > "remote-connect-mcp-${RELEASE_VERSION}-linux-${TARGET_ARCH}.tar.gz.sha256"
      - name: Native Liquibase migration smoke
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RCM_CENTER_PERSISTENCE_MODE: postgres
          RCM_CENTER_REQUIRE_DURABLE_STORAGE: "false"
          RCM_CENTER_LIQUIBASE_ENABLED: "true"
          RCM_CENTER_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/remote_connect_mcp
          RCM_CENTER_DATABASE_USERNAME: postgres
          RCM_CENTER_DATABASE_PASSWORD: postgres
        run: |
          set -euo pipefail
          timeout 120s "out/${TARGET_ARCH}/center/rcm-center" --migrate
      - name: Generate Linux Native SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: out/${{ matrix.arch }}
          format: spdx-json
          output-file: remote-connect-mcp-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}.spdx.json
          artifact-name: java-linux-${{ matrix.arch }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate native artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            out/${{ matrix.arch }}/rcm-center
            out/${{ matrix.arch }}/rcm-agent
            out/${{ matrix.arch }}/rcm-desktop-companion
            out/${{ matrix.arch }}/rcm-browser-agent
            remote-connect-mcp-*.tar.gz
            remote-connect-mcp-*.zip
            remote-connect-mcp-*.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-linux-${{ matrix.arch }}
          path: |
            remote-connect-mcp-*.tar.gz
            remote-connect-mcp-*.tar.gz.sha256
            remote-connect-mcp-agent-*-linux-${{ matrix.arch }}.zip
            remote-connect-mcp-agent-*-linux-${{ matrix.arch }}.zip.sha256
            remote-connect-mcp-desktop-*-linux-${{ matrix.arch }}.zip
            remote-connect-mcp-desktop-*-linux-${{ matrix.arch }}.zip.sha256
            remote-connect-mcp-browser-*-linux-${{ matrix.arch }}.zip
            remote-connect-mcp-browser-*-linux-${{ matrix.arch }}.zip.sha256
            remote-connect-mcp-center-*-linux-${{ matrix.arch }}.zip
            remote-connect-mcp-center-*-linux-${{ matrix.arch }}.zip.sha256
            remote-connect-mcp-*.spdx.json
          if-no-files-found: error
      - name: Upload Linux Agent resource report
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-linux-${{ matrix.arch }}-resource
          path: ${{ runner.temp }}/rcm-agent-resource-${{ matrix.arch }}.json
          if-no-files-found: error

  windows-native:
    needs: [prepare, jvm-and-console]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sync standalone MCP Apps artifact viewer
        run: bash scripts/sync-artifact-viewer.sh
      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: false
      - name: Build Windows amd64 Native Images
        working-directory: java
        shell: pwsh
        # Native Image can consume several GiB per image. Serialize the four
        # images so the Windows hosted runner does not page/OOM.
        run: .\gradlew.bat -PnativeMarch=x86-64-v2 :center:nativeCompile :agent:nativeCompile :desktop:nativeCompile :browser:nativeCompile --no-daemon --no-parallel
      - name: Native MCP and Agent smoke tests
        shell: pwsh
        run: |
          .\scripts\smoke-java.ps1 -CenterBinary .\java\center\build\native\nativeCompile\rcm-center.exe -Port 18185
          .\scripts\smoke-java-agent.ps1 -CenterBinary .\java\center\build\native\nativeCompile\rcm-center.exe -AgentBinary .\java\agent\build\native\nativeCompile\rcm-agent.exe -Port 18186 -ResourceReport "$env:RUNNER_TEMP\rcm-agent-resource-windows-amd64.json"
          .\scripts\smoke-java-websocket.ps1 -CenterBinary .\java\center\build\native\nativeCompile\rcm-center.exe -Port 18187
          $desktopBinary = '.\java\desktop\build\native\nativeCompile\rcm-desktop-companion.exe'
          if (-not (Test-Path -LiteralPath $desktopBinary -PathType Leaf)) { throw "desktop companion Native Image was not produced" }
          & $desktopBinary --invalid-arguments *> $null
          if ($LASTEXITCODE -ne 2) { throw "desktop companion argument contract failed with exit code $LASTEXITCODE" }
          $browserBinary = '.\java\browser\build\native\nativeCompile\rcm-browser-agent.exe'
          if (-not (Test-Path -LiteralPath $browserBinary -PathType Leaf)) { throw "browser Agent Native Image was not produced" }
          & $browserBinary --invalid-arguments *> $null
          if ($LASTEXITCODE -ne 2) { throw "browser Agent argument contract failed with exit code $LASTEXITCODE" }
          $env:RCM_AGENT_MAX_RSS_MIB = '256'
          python scripts/check-agent-resource-report.py "$env:RUNNER_TEMP\rcm-agent-resource-windows-amd64.json"
      - name: Package Windows amd64 artifacts
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'java-release-windows-amd64'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
           $centerOut = Join-Path $out 'center'
           $agentOut = Join-Path $out 'agent'
           $desktopOut = Join-Path $out 'desktop'
           $browserOut = Join-Path $out 'browser'
           New-Item -ItemType Directory -Force -Path $centerOut, $agentOut, $desktopOut, $browserOut | Out-Null
           Copy-Item java/center/build/native/nativeCompile/rcm-center.exe $centerOut/rcm-center.exe
           Copy-Item java/agent/build/native/nativeCompile/rcm-agent.exe $agentOut/rcm-agent.exe
           Copy-Item java/desktop/build/native/nativeCompile/rcm-desktop-companion.exe $desktopOut/rcm-desktop-companion.exe
           Copy-Item java/browser/build/native/nativeCompile/rcm-browser-agent.exe $browserOut/rcm-browser-agent.exe
           Get-ChildItem java/center/build/native/nativeCompile/*.dll -File -ErrorAction SilentlyContinue | Copy-Item -Destination $centerOut
           Get-ChildItem java/agent/build/native/nativeCompile/*.dll -File -ErrorAction SilentlyContinue | Copy-Item -Destination $agentOut
           Get-ChildItem java/desktop/build/native/nativeCompile/*.dll -File -ErrorAction SilentlyContinue | Copy-Item -Destination $desktopOut
           Get-ChildItem java/browser/build/native/nativeCompile/*.dll -File -ErrorAction SilentlyContinue | Copy-Item -Destination $browserOut
           Copy-Item scripts/install-java-agent.ps1, scripts/first-install-java-agent.ps1, README.md, LICENSE, NOTICE $out
           foreach ($bundle in @($centerOut, $agentOut, $desktopOut, $browserOut)) {
             Get-FileHash (Get-ChildItem $bundle -File | Where-Object { $_.Extension -in '.exe','.dll' }) -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Set-Content (Join-Path $bundle 'SHA256SUMS') -Encoding ascii
           }
          # The Agent updater consumes a flat bundle so the executable and all
          # Native Image DLLs are replaced atomically.  Keep this asset name in
          # sync with UpgradeService.resolveReleaseArtifact().
          $agentArchive = Join-Path $PWD "remote-connect-mcp-agent-$env:RELEASE_VERSION-windows-amd64.zip"
          Push-Location $agentOut
           try { Compress-Archive -Path '*.exe','*.dll' -DestinationPath $agentArchive -CompressionLevel Optimal -Force }
           finally { Pop-Location }
           (Get-FileHash "remote-connect-mcp-agent-$env:RELEASE_VERSION-windows-amd64.zip" -Algorithm SHA256).Hash.ToLower() + "  remote-connect-mcp-agent-$env:RELEASE_VERSION-windows-amd64.zip" | Set-Content "remote-connect-mcp-agent-$env:RELEASE_VERSION-windows-amd64.zip.sha256" -Encoding ascii
           & "$PWD/scripts/verify-native-bundle.ps1" -AgentArchive "$PWD/remote-connect-mcp-agent-$env:RELEASE_VERSION-windows-amd64.zip"
           $desktopArchive = Join-Path $PWD "remote-connect-mcp-desktop-$env:RELEASE_VERSION-windows-amd64.zip"
           Push-Location $desktopOut
           try { Compress-Archive -Path '*.exe','*.dll' -DestinationPath $desktopArchive -CompressionLevel Optimal -Force }
           finally { Pop-Location }
           (Get-FileHash $desktopArchive -Algorithm SHA256).Hash.ToLower() + "  remote-connect-mcp-desktop-$env:RELEASE_VERSION-windows-amd64.zip" | Set-Content "$desktopArchive.sha256" -Encoding ascii
           & "$PWD/scripts/verify-native-bundle.ps1" -AgentArchive $desktopArchive -ExecutableName 'rcm-desktop-companion.exe'
           $browserArchive = Join-Path $PWD "remote-connect-mcp-browser-$env:RELEASE_VERSION-windows-amd64.zip"
           Push-Location $browserOut
           try { Compress-Archive -Path '*.exe','*.dll' -DestinationPath $browserArchive -CompressionLevel Optimal -Force }
           finally { Pop-Location }
           (Get-FileHash $browserArchive -Algorithm SHA256).Hash.ToLower() + "  remote-connect-mcp-browser-$env:RELEASE_VERSION-windows-amd64.zip" | Set-Content "$browserArchive.sha256" -Encoding ascii
           & "$PWD/scripts/verify-native-bundle.ps1" -AgentArchive $browserArchive -ExecutableName 'rcm-browser-agent.exe'
           Compress-Archive -Path "$out/*" -DestinationPath "remote-connect-mcp-$env:RELEASE_VERSION-windows-amd64.zip" -CompressionLevel Optimal -Force
          (Get-FileHash "remote-connect-mcp-$env:RELEASE_VERSION-windows-amd64.zip" -Algorithm SHA256).Hash.ToLower() + "  remote-connect-mcp-$env:RELEASE_VERSION-windows-amd64.zip" | Set-Content "remote-connect-mcp-$env:RELEASE_VERSION-windows-amd64.zip.sha256" -Encoding ascii
      - name: Generate Windows Native SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: java-release-windows-amd64
          format: spdx-json
          output-file: remote-connect-mcp-${{ needs.prepare.outputs.version }}-windows-amd64.spdx.json
          artifact-name: java-windows-amd64-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate native artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            java-release-windows-amd64/center/rcm-center.exe
            java-release-windows-amd64/agent/rcm-agent.exe
            java-release-windows-amd64/desktop/rcm-desktop-companion.exe
            java-release-windows-amd64/browser/rcm-browser-agent.exe
            remote-connect-mcp-*.zip
            remote-connect-mcp-*.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-windows-amd64
          path: |
            remote-connect-mcp-*.zip
            remote-connect-mcp-*.zip.sha256
            remote-connect-mcp-*.spdx.json
          if-no-files-found: error
      - name: Upload Windows Agent resource report
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-windows-amd64-resource
          path: ${{ runner.temp }}/rcm-agent-resource-windows-amd64.json
          if-no-files-found: error

  images:
    # Native artifacts are produced and smoke-tested by architecture-matched
    # jobs first. This job only assembles/pushes runtime images, so it never
    # repeats the expensive QEMU Native Image compilation.
    needs: [prepare, jvm-and-console, linux-native]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download architecture-matched Native bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-linux-amd64
          path: image-input/amd64
      - name: Download architecture-matched ARM64 Native bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-linux-arm64
          path: image-input/arm64
      - name: Publish Center and Agent images
        env:
          IMAGE_OWNER: prodigalgal
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          mkdir -p image-root/amd64/center image-root/amd64/agent image-root/arm64/center image-root/arm64/agent
          unzip -q "image-input/amd64/remote-connect-mcp-center-${RELEASE_VERSION}-linux-amd64.zip" -d image-root/amd64/center
          unzip -q "image-input/amd64/remote-connect-mcp-agent-${RELEASE_VERSION}-linux-amd64.zip" -d image-root/amd64/agent
          unzip -q "image-input/arm64/remote-connect-mcp-center-${RELEASE_VERSION}-linux-arm64.zip" -d image-root/arm64/center
          unzip -q "image-input/arm64/remote-connect-mcp-agent-${RELEASE_VERSION}-linux-arm64.zip" -d image-root/arm64/agent
          for kind in center agent; do
            docker buildx build --platform linux/amd64 \
              --file "java/Dockerfile.${kind}.native-runtime" \
              --tag "ghcr.io/${IMAGE_OWNER}/remote-connect-mcp-${kind}-java:${RELEASE_VERSION}-amd64" \
              --provenance=true --sbom=true --push "image-root/amd64/${kind}"
            docker buildx build --platform linux/arm64 \
              --file "java/Dockerfile.${kind}.native-runtime" \
              --tag "ghcr.io/${IMAGE_OWNER}/remote-connect-mcp-${kind}-java:${RELEASE_VERSION}-arm64" \
              --provenance=true --sbom=true --push "image-root/arm64/${kind}"
            docker buildx imagetools create \
              --tag "ghcr.io/${IMAGE_OWNER}/remote-connect-mcp-${kind}-java:${RELEASE_VERSION}" \
              "ghcr.io/${IMAGE_OWNER}/remote-connect-mcp-${kind}-java:${RELEASE_VERSION}-amd64" \
              "ghcr.io/${IMAGE_OWNER}/remote-connect-mcp-${kind}-java:${RELEASE_VERSION}-arm64"
            if [[ "${IS_PRERELEASE}" != "true" ]]; then
              docker buildx imagetools create \
                --tag "ghcr.io/${IMAGE_OWNER}/remote-connect-mcp-${kind}-java:latest" \
                "ghcr.io/${IMAGE_OWNER}/remote-connect-mcp-${kind}-java:${RELEASE_VERSION}-amd64" \
                "ghcr.io/${IMAGE_OWNER}/remote-connect-mcp-${kind}-java:${RELEASE_VERSION}-arm64"
            fi
          done
          console_tags=(--tag "ghcr.io/${IMAGE_OWNER}/remote-connect-mcp-console:${RELEASE_VERSION}")
          if [[ "${IS_PRERELEASE}" != "true" ]]; then
            console_tags+=(--tag "ghcr.io/${IMAGE_OWNER}/remote-connect-mcp-console:latest")
          fi
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg RCM_CI_BUILD=true --file web/Dockerfile "${console_tags[@]}" --provenance=true --sbom=true --push web

  release:
    # Do not publish the GitHub Release until the multi-arch images have also
    # finished pushing; the Release tag and GHCR image tags are one atomic
    # rollout unit for Center/Agent upgrades.
    needs: [prepare, linux-native, windows-native, images]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true
      - name: Generate component release manifest
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path('release')
          version = os.environ['RELEASE_VERSION']
          tag = os.environ['RELEASE_TAG']
          repo = os.environ['RELEASE_REPOSITORY']
          components = []
          pattern = re.compile(r'^remote-connect-mcp-(desktop|browser)-' + re.escape(version) + r'-(linux|windows)-(amd64|arm64)\.zip$')
          for path in sorted(root.glob('remote-connect-mcp-*.zip')):
              match = pattern.match(path.name)
              if not match:
                  continue
              kind, os_name, arch = match.groups()
              component = 'desktop-companion' if kind == 'desktop' else 'browser-agent'
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              components.append({
                  'component': component, 'version': version, 'os': os_name, 'arch': arch,
                  'url': f'https://github.com/{repo}/releases/download/{tag}/{path.name}',
                  'sha256': digest, 'bytes': path.stat().st_size, 'restart_policy': 'drain-and-restart'
              })
          manifest = {'version': version, 'components': components}
          target = root / f'remote-connect-mcp-manifest-{version}.json'
          target.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(target)
          PY
      - name: Sign release assets with Sigstore
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: |
            release/*.zip
            release/*.tar.gz
            release/*.zip.sha256
            release/*.tar.gz.sha256
            release/*.spdx.json
            release/remote-connect-mcp-manifest-*.json
          release-signing-artifacts: false
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          VERIFY_TAG: ${{ needs.prepare.outputs.verify_tag }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release -maxdepth 1 -type f \( -name '*.zip' -o -name '*.zip.sha256' -o -name '*.tar.gz' -o -name '*.tar.gz.sha256' -o -name '*.spdx.json' -o -name '*.sigstore.json' -o -name 'remote-connect-mcp-manifest-*.json' \) -print0 | sort -z)
          ((${#assets[@]} > 0))
          args=("${RELEASE_TAG}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" --generate-notes)
          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then args+=(--prerelease); fi
          if [[ "${VERIFY_TAG}" == "true" ]]; then args+=(--verify-tag); fi
          gh release create "${args[@]}"

  gitops-deploy:
    # The build/release/image jobs are the promotion gate.  A successful
    # preview (main) updates the private staging overlay; only a stable
    # java-vX.Y.Z tag updates production.  Argo CD remains the component that
    # applies the resulting Git commit to Kubernetes.
    needs: [prepare, images, release]
    if: needs.prepare.outputs.publish == 'true' && needs.release.result == 'success' && vars.RCM_GITOPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      GITOPS_REPOSITORY: ${{ secrets.RCM_GITOPS_REPOSITORY }}
      GITOPS_SSH_KEY: ${{ secrets.RCM_GITOPS_SSH_KEY }}
    steps:
      - name: Configure GitHub-only GitOps deploy key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITOPS_REPOSITORY}"
          test -n "${GITOPS_SSH_KEY}"
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${GITOPS_SSH_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          ssh-keyscan -t ed25519 github.com >> "${HOME}/.ssh/known_hosts"
          chmod 644 "${HOME}/.ssh/known_hosts"
      - name: Login to GHCR for immutable digest lookup
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve published image digests
        id: images
        shell: bash
        run: |
          set -euo pipefail
          center="ghcr.io/prodigalgal/remote-connect-mcp-center-java:${RELEASE_VERSION}"
          console="ghcr.io/prodigalgal/remote-connect-mcp-console:${RELEASE_VERSION}"
          center_digest="$(docker buildx imagetools inspect "${center}" | awk '/^Digest:/ {print $2; exit}')"
          console_digest="$(docker buildx imagetools inspect "${console}" | awk '/^Digest:/ {print $2; exit}')"
          [[ "${center_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${console_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'center=%s\nconsole=%s\n' "${center_digest}" "${console_digest}" >> "${GITHUB_OUTPUT}"
      - name: Checkout private GitOps repository
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main "git@github.com:${GITOPS_REPOSITORY}.git" gitops
      - name: Pin Center and Console images by digest
        shell: bash
        env:
          CENTER_DIGEST: ${{ steps.images.outputs.center }}
          CONSOLE_DIGEST: ${{ steps.images.outputs.console }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
            overlay='remote-connect-mcp-java-staging'
          else
            overlay='remote-connect-mcp-java-production'
          fi
          export OVERLAY_DIR="gitops/${overlay}"
          test -d "${OVERLAY_DIR}"
          CENTER_DIGEST="${CENTER_DIGEST}" CONSOLE_DIGEST="${CONSOLE_DIGEST}" OVERLAY_DIR="${OVERLAY_DIR}" python3 - <<'PY'
          import os
          import pathlib
          import re

          root = pathlib.Path(os.environ['OVERLAY_DIR'])
          center_digest = os.environ['CENTER_DIGEST']
          console_digest = os.environ['CONSOLE_DIGEST']
          center_files = [root / 'center.yaml', root / 'migration-job.yaml']
          console_files = [root / 'console.yaml']
          center_pattern = re.compile(r'(image:\s*ghcr\.io/prodigalgal/remote-connect-mcp-center-java@)sha256:[0-9a-f]{64}')
          console_pattern = re.compile(r'(image:\s*ghcr\.io/prodigalgal/remote-connect-mcp-console@)sha256:[0-9a-f]{64}')

          def replace(files, pattern, digest, label):
              total = 0
              for path in files:
                  if not path.is_file():
                      raise SystemExit(f'missing GitOps manifest: {path}')
                  text = path.read_text(encoding='utf-8')
                  text, count = pattern.subn(r'\1' + digest, text)
                  if count == 0:
                      raise SystemExit(f'{label} digest was not found in {path}')
                  path.write_text(text, encoding='utf-8', newline='\n')
                  total += count
              return total

          if replace(center_files, center_pattern, center_digest, 'Center') != 2:
              raise SystemExit('expected exactly two Center image references')
          if replace(console_files, console_pattern, console_digest, 'Console') != 1:
              raise SystemExit('expected exactly one Console image reference')
          PY
          git -C gitops diff --check
          git -C gitops diff -- "${overlay}/center.yaml" "${overlay}/migration-job.yaml" "${overlay}/console.yaml"
      - name: Commit and push GitOps promotion
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
            overlay='remote-connect-mcp-java-staging'
          else
            overlay='remote-connect-mcp-java-production'
          fi
          git -C gitops config user.name 'remote-connect-mcp-actions[bot]'
          git -C gitops config user.email 'remote-connect-mcp-actions[bot]@users.noreply.github.com'
          git -C gitops add "${overlay}/center.yaml" "${overlay}/migration-job.yaml" "${overlay}/console.yaml"
          if git -C gitops diff --cached --quiet; then
            echo 'GitOps overlay already points at this release.'
            exit 0
          fi
          git -C gitops commit -m "chore(remote-connect-mcp): promote ${RELEASE_VERSION}"
          git -C gitops push origin HEAD:main

name: Agent Component Release

on:
  push:
    branches: [main]
    tags: ["java-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Agent release version, for example v0.1.32"
        required: true
        type: string
      prerelease:
        description: "Publish as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: rcm-agent-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect Agent changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" || "${REF_TYPE}" == "tag" ]]; then
            echo 'changed=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          changed="$(python3 scripts/detect-component-changes.py agent --head "${SHA}" --since-release)"
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"

  prepare:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.coordinates.outputs.version }}
      tag: ${{ steps.coordinates.outputs.tag }}
      prerelease: ${{ steps.coordinates.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/scan-repository-secrets.sh
          python3 scripts/verify-agent-boundaries.py
      - name: Resolve Agent coordinates
        id: coordinates
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION#java-}"
            prerelease="${INPUT_PRERELEASE:-false}"
          elif [[ "${REF_TYPE}" == "tag" && "${REF_NAME}" == java-v* ]]; then
            version="${REF_NAME#java-}"
            prerelease=false
          else
            version="v0.0.0-main.${RUN_NUMBER}.${SHA:0:12}"
            prerelease=true
          fi
          [[ "${version}" =~ ^v[0-9A-Za-z][0-9A-Za-z._+-]{0,127}$ ]] || {
            echo 'Agent version must start with v and contain only release-safe characters' >&2
            exit 2
          }
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=java-${version}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

  agent-tests:
    name: Agent and updater JVM component gate
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Agent, Desktop, Browser and updater tests
        working-directory: java
        run: bash ./gradlew -PreleaseVersion=${{ needs.prepare.outputs.version }} :agent:test :desktop:test :browser:test :updater:test --no-daemon

  browser-runtime:
    name: Camoufox navigation gate
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/browser-runtime/package-lock.json
      - name: Install and smoke Camoufox
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/browser-worker.mjs
          node --check scripts/smoke-browser-runtime.mjs
          npm ci --prefix scripts/browser-runtime --no-audit --no-fund
          export CAMOUFOX_INSTALL_DIR="${RUNNER_TEMP}/camoufox"
          node scripts/browser-runtime/node_modules/camoufox-js/dist/__main__.js fetch
          cp scripts/browser-worker.mjs scripts/browser-runtime/browser-worker.mjs
          node scripts/smoke-browser-runtime.mjs

  linux-native:
    name: Agent Native (${{ matrix.arch }})
    needs: [prepare, agent-tests, browser-runtime]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and package Agent component bundles
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          native_march='x86-64-v2'
          if [[ "${TARGET_ARCH}" == 'arm64' ]]; then native_march='armv8-a'; fi
          sudo apt-get update
          sudo apt-get install -y zip
          mkdir -p "out/${TARGET_ARCH}" "out/${TARGET_ARCH}/agent" "out/${TARGET_ARCH}/desktop" "out/${TARGET_ARCH}/browser" "out/${TARGET_ARCH}/updater"
          for kind in agent desktop browser updater; do
            docker buildx build --platform "linux/${TARGET_ARCH}" --target artifact \
              --build-arg RCM_CI_BUILD=true --build-arg RCM_NATIVE_MARCH="${native_march}" \
              --file "java/Dockerfile.${kind}.native" --output "type=local,dest=out/${kind}-${TARGET_ARCH}" java
          done
          agent="$(find "out/agent-${TARGET_ARCH}" -type f -name rcm-agent -print -quit)"
          desktop="$(find "out/desktop-${TARGET_ARCH}" -type f -name rcm-desktop-companion -print -quit)"
          browser="$(find "out/browser-${TARGET_ARCH}" -type f -name rcm-browser-agent -print -quit)"
          updater="$(find "out/updater-${TARGET_ARCH}" -type f -name rcm-updater -print -quit)"
          test -n "${agent}" && test -n "${desktop}" && test -n "${browser}" && test -n "${updater}"
          if [[ "${TARGET_ARCH}" == 'amd64' ]]; then python3 scripts/normalize-native-isa.py --normalize "${agent}" "${desktop}" "${browser}" "${updater}"; fi
          python3 scripts/normalize-native-isa.py --check "${agent}" "${desktop}" "${browser}" "${updater}"
          cp "${agent}" "out/${TARGET_ARCH}/agent/rcm-agent"
          cp "${desktop}" "out/${TARGET_ARCH}/desktop/rcm-desktop-companion"
          cp "${browser}" "out/${TARGET_ARCH}/browser/rcm-browser-agent"
          cp "${updater}" "out/${TARGET_ARCH}/updater/rcm-updater"
          find "$(dirname "${agent}")" -maxdepth 1 -type f \( -name '*.so' -o -name '*.so.*' \) -exec cp -f {} "out/${TARGET_ARCH}/agent/" \;
          find "$(dirname "${desktop}")" -maxdepth 1 -type f \( -name '*.so' -o -name '*.so.*' \) -exec cp -f {} "out/${TARGET_ARCH}/desktop/" \;
          find "$(dirname "${browser}")" -maxdepth 1 -type f \( -name '*.so' -o -name '*.so.*' \) -exec cp -f {} "out/${TARGET_ARCH}/browser/" \;
          find "$(dirname "${updater}")" -maxdepth 1 -type f \( -name '*.so' -o -name '*.so.*' \) -exec cp -f {} "out/${TARGET_ARCH}/updater/" \;
          chmod +x "out/${TARGET_ARCH}/agent/rcm-agent" "out/${TARGET_ARCH}/desktop/rcm-desktop-companion" "out/${TARGET_ARCH}/browser/rcm-browser-agent" "out/${TARGET_ARCH}/updater/rcm-updater"
          for bin in "out/${TARGET_ARCH}/desktop/rcm-desktop-companion" "out/${TARGET_ARCH}/browser/rcm-browser-agent" "out/${TARGET_ARCH}/updater/rcm-updater"; do
            set +e; "${bin}" --invalid-arguments >/dev/null 2>&1; code=$?; set -e
            test "${code}" -eq 2
          done
          for dir in agent desktop browser updater; do (cd "out/${TARGET_ARCH}/${dir}" && sha256sum $(find . -maxdepth 1 -type f -printf '%f\n' | sort) > SHA256SUMS); done
          agent_archive="remote-connect-mcp-agent-${RELEASE_VERSION}-linux-${TARGET_ARCH}.zip"
          desktop_archive="remote-connect-mcp-desktop-${RELEASE_VERSION}-linux-${TARGET_ARCH}.zip"
          browser_archive="remote-connect-mcp-browser-${RELEASE_VERSION}-linux-${TARGET_ARCH}.zip"
          updater_archive="remote-connect-mcp-updater-${RELEASE_VERSION}-linux-${TARGET_ARCH}.zip"
          for spec in "agent:${agent_archive}" "desktop:${desktop_archive}" "browser:${browser_archive}" "updater:${updater_archive}"; do
            dir="${spec%%:*}"; archive="${spec#*:}"
            files=$(cd "out/${TARGET_ARCH}/${dir}" && find . -maxdepth 1 -type f \( -name 'rcm-*' -o -name '*.so' -o -name '*.so.*' \) -printf '%f\n' | sort)
            (cd "out/${TARGET_ARCH}/${dir}" && zip -q -9 -j "${GITHUB_WORKSPACE}/${archive}" ${files})
            sha256sum "${archive}" > "${archive}.sha256"
          done
          bash scripts/verify-native-bundle.sh "${agent_archive}" rcm-agent
          bash scripts/verify-native-bundle.sh "${desktop_archive}" rcm-desktop-companion
          bash scripts/verify-native-bundle.sh "${browser_archive}" rcm-browser-agent
          bash scripts/verify-native-bundle.sh "${updater_archive}" rcm-updater
          cp scripts/install-agent.sh scripts/first-install-agent.sh deploy/systemd/remote-connect-mcp-agent.service deploy/systemd/agent.env.example README.md LICENSE NOTICE "out/${TARGET_ARCH}/"
          tar -C out -I 'gzip -9' -cf "remote-connect-mcp-${RELEASE_VERSION}-linux-${TARGET_ARCH}.tar.gz" "${TARGET_ARCH}"
          sha256sum "remote-connect-mcp-${RELEASE_VERSION}-linux-${TARGET_ARCH}.tar.gz" > "remote-connect-mcp-${RELEASE_VERSION}-linux-${TARGET_ARCH}.tar.gz.sha256"
      - name: Generate Agent SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: out/${{ matrix.arch }}
          format: spdx-json
          output-file: remote-connect-mcp-agent-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rcm-agent-linux-${{ matrix.arch }}
          path: |
            remote-connect-mcp-*.tar.gz
            remote-connect-mcp-*.tar.gz.sha256
            remote-connect-mcp-agent-*-linux-${{ matrix.arch }}.zip
            remote-connect-mcp-agent-*-linux-${{ matrix.arch }}.zip.sha256
            remote-connect-mcp-desktop-*-linux-${{ matrix.arch }}.zip
            remote-connect-mcp-desktop-*-linux-${{ matrix.arch }}.zip.sha256
            remote-connect-mcp-browser-*-linux-${{ matrix.arch }}.zip
            remote-connect-mcp-browser-*-linux-${{ matrix.arch }}.zip.sha256
            remote-connect-mcp-updater-*-linux-${{ matrix.arch }}.zip
            remote-connect-mcp-updater-*-linux-${{ matrix.arch }}.zip.sha256
            remote-connect-mcp-agent-*-linux-${{ matrix.arch }}.spdx.json
          if-no-files-found: error

  windows-native:
    name: Agent Native (windows-amd64)
    needs: [prepare, agent-tests]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: false
      - name: Build Agent and updater Native Images
        working-directory: java
        shell: pwsh
        run: .\gradlew.bat -PnativeMarch=x86-64-v2 :agent:nativeCompile :desktop:nativeCompile :browser:nativeCompile :updater:nativeCompile --no-daemon --no-parallel
      - name: Validate Agent Native contracts
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $agent = '.\java\agent\build\native\nativeCompile\rcm-agent.exe'
          if (-not (Test-Path -LiteralPath $agent -PathType Leaf)) { throw "Native binary missing: $agent" }
          foreach ($bin in @(
            '.\java\desktop\build\native\nativeCompile\rcm-desktop-companion.exe',
            '.\java\browser\build\native\nativeCompile\rcm-browser-agent.exe',
            '.\java\updater\build\native\nativeCompile\rcm-updater.exe'
          )) {
            if (-not (Test-Path -LiteralPath $bin -PathType Leaf)) { throw "Native binary missing: $bin" }
            & $bin --invalid-arguments *> $null
            $exitCode = $LASTEXITCODE
            Write-Host "Invalid-argument contract: $bin exited $exitCode"
            if ($exitCode -ne 2) { throw "argument contract failed for $bin (exit $exitCode)" }
          }
          $global:LASTEXITCODE = 0
      - name: Package Agent Windows bundles
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'agent-release-windows-amd64'
          $agentOut = Join-Path $out 'agent'; $desktopOut = Join-Path $out 'desktop'; $browserOut = Join-Path $out 'browser'; $updaterOut = Join-Path $out 'updater'
          New-Item -ItemType Directory -Force -Path $agentOut,$desktopOut,$browserOut,$updaterOut | Out-Null
          Copy-Item java/agent/build/native/nativeCompile/rcm-agent.exe $agentOut/rcm-agent.exe
          Copy-Item java/desktop/build/native/nativeCompile/rcm-desktop-companion.exe $desktopOut/rcm-desktop-companion.exe
          Copy-Item java/browser/build/native/nativeCompile/rcm-browser-agent.exe $browserOut/rcm-browser-agent.exe
          Copy-Item java/updater/build/native/nativeCompile/rcm-updater.exe $updaterOut/rcm-updater.exe
          Get-ChildItem java/agent/build/native/nativeCompile/*.dll -File -ErrorAction SilentlyContinue | Copy-Item -Destination $agentOut
          Get-ChildItem java/desktop/build/native/nativeCompile/*.dll -File -ErrorAction SilentlyContinue | Copy-Item -Destination $desktopOut
          Get-ChildItem java/browser/build/native/nativeCompile/*.dll -File -ErrorAction SilentlyContinue | Copy-Item -Destination $browserOut
          Get-ChildItem java/updater/build/native/nativeCompile/*.dll -File -ErrorAction SilentlyContinue | Copy-Item -Destination $updaterOut
          Copy-Item scripts/install-agent.ps1, scripts/first-install-agent.ps1, README.md, LICENSE, NOTICE $out
          foreach ($bundle in @($agentOut,$desktopOut,$browserOut,$updaterOut)) {
            Get-FileHash (Get-ChildItem $bundle -File | Where-Object { $_.Extension -in '.exe','.dll' }) -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Set-Content (Join-Path $bundle 'SHA256SUMS') -Encoding ascii
          }
          $specs = @(
            @{ Dir=$agentOut; Name="remote-connect-mcp-agent-$env:RELEASE_VERSION-windows-amd64.zip"; Exe='rcm-agent.exe' },
            @{ Dir=$desktopOut; Name="remote-connect-mcp-desktop-$env:RELEASE_VERSION-windows-amd64.zip"; Exe='rcm-desktop-companion.exe' },
            @{ Dir=$browserOut; Name="remote-connect-mcp-browser-$env:RELEASE_VERSION-windows-amd64.zip"; Exe='rcm-browser-agent.exe' },
            @{ Dir=$updaterOut; Name="remote-connect-mcp-updater-$env:RELEASE_VERSION-windows-amd64.zip"; Exe='rcm-updater.exe' }
          )
          foreach ($spec in $specs) {
            Push-Location $spec.Dir
            try { Compress-Archive -Path '*.exe','*.dll' -DestinationPath (Join-Path $PWD "..\..\$($spec.Name)") -CompressionLevel Optimal -Force }
            finally { Pop-Location }
            $archive = Join-Path $PWD $spec.Name
            (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() + "  $($spec.Name)" | Set-Content "$archive.sha256" -Encoding ascii
            & "$PWD/scripts/verify-native-bundle.ps1" -AgentArchive $archive -ExecutableName $spec.Exe
          }
          Compress-Archive -Path "$out/*" -DestinationPath "remote-connect-mcp-$env:RELEASE_VERSION-windows-amd64.zip" -CompressionLevel Optimal -Force
          (Get-FileHash "remote-connect-mcp-$env:RELEASE_VERSION-windows-amd64.zip" -Algorithm SHA256).Hash.ToLower() + "  remote-connect-mcp-$env:RELEASE_VERSION-windows-amd64.zip" | Set-Content "remote-connect-mcp-$env:RELEASE_VERSION-windows-amd64.zip.sha256" -Encoding ascii
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rcm-agent-windows-amd64
          path: |
            remote-connect-mcp-*.zip
            remote-connect-mcp-*.zip.sha256
            remote-connect-mcp-*.tar.gz
          if-no-files-found: error

  images:
    name: Publish command-agent image
    needs: [prepare, linux-native]
    if: needs.prepare.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rcm-agent-linux-amd64
          path: image-input/amd64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rcm-agent-linux-arm64
          path: image-input/arm64
      - name: Assemble and publish command-agent image
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${IMAGE_OWNER,,}"
          mkdir -p image-root/amd64 image-root/arm64
          unzip -q "image-input/amd64/remote-connect-mcp-agent-${RELEASE_VERSION}-linux-amd64.zip" -d image-root/amd64
          unzip -q "image-input/arm64/remote-connect-mcp-agent-${RELEASE_VERSION}-linux-arm64.zip" -d image-root/arm64
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/${arch}" --file java/Dockerfile.agent.native-runtime \
              --tag "ghcr.io/${owner}/remote-connect-mcp-agent-java:${RELEASE_VERSION}-${arch}" \
              --provenance=true --sbom=true --push "image-root/${arch}"
          done
          docker buildx imagetools create --tag "ghcr.io/${owner}/remote-connect-mcp-agent-java:${RELEASE_VERSION}" \
            "ghcr.io/${owner}/remote-connect-mcp-agent-java:${RELEASE_VERSION}-amd64" \
            "ghcr.io/${owner}/remote-connect-mcp-agent-java:${RELEASE_VERSION}-arm64"
          if [[ "${{ needs.prepare.outputs.prerelease }}" != 'true' ]]; then
            docker buildx imagetools create --tag "ghcr.io/${owner}/remote-connect-mcp-agent-java:latest" \
              "ghcr.io/${owner}/remote-connect-mcp-agent-java:${RELEASE_VERSION}-amd64" \
              "ghcr.io/${owner}/remote-connect-mcp-agent-java:${RELEASE_VERSION}-arm64"
          fi

  release:
    name: Publish Agent release
    needs: [prepare, linux-native, windows-native, images]
    if: needs.prepare.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          pattern: rcm-agent-*
          merge-multiple: true
      - name: Generate component release manifest
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path('release')
          version = os.environ['RELEASE_VERSION']
          tag = os.environ['RELEASE_TAG']
          repo = os.environ['RELEASE_REPOSITORY']
          import subprocess
          updater_revision = subprocess.check_output(
              ['git', 'log', '-1', '--format=%h', '--',
               'java/updater/src/main/java', 'java/updater/src/main/resources',
               'java/updater/build.gradle.kts', 'java/Dockerfile.updater.native',
               'java/build.gradle.kts', 'java/settings.gradle.kts', 'java/gradle.properties',
               'java/gradle', 'java/gradlew', 'java/gradlew.bat',
               'java/protocol/src/main/java/com/prodigalgal/remoteconnectmcp/protocol/JsonCodec.java'],
              text=True, encoding='utf-8').strip()
          if not updater_revision:
              raise SystemExit('could not resolve the standalone updater build revision')
          updater_version = f'v1.0.0+{updater_revision}'
          minimum_agent_version = pathlib.Path('java/updater/minimum-agent-version.txt').read_text(encoding='utf-8').strip()
          components = []
          pattern = re.compile(r'^remote-connect-mcp-(desktop|browser|updater)-' + re.escape(version) + r'-(linux|windows)-(amd64|arm64)\.zip$')
          expected = {(kind, os_name, arch) for kind in ('desktop', 'browser', 'updater')
                      for os_name, arch in (('linux', 'amd64'), ('linux', 'arm64'), ('windows', 'amd64'))}
          found = set()
          for path in sorted(root.glob('remote-connect-mcp-*.zip')):
              match = pattern.match(path.name)
              if not match: continue
              kind, os_name, arch = match.groups()
              found.add((kind, os_name, arch))
              checksum = path.with_name(path.name + '.sha256')
              actual_sha = hashlib.sha256(path.read_bytes()).hexdigest()
              if not checksum.is_file() or checksum.read_text(encoding='utf-8').split()[0].lower() != actual_sha:
                  raise SystemExit(f'missing or mismatched checksum: {checksum.name}')
              component = 'desktop-companion' if kind == 'desktop' else 'browser-agent' if kind == 'browser' else 'agent-updater'
              component_version = updater_version if kind == 'updater' else version
              plan = {'component': component, 'version': component_version, 'os': os_name, 'arch': arch,
                  'url': f'https://github.com/{repo}/releases/download/{tag}/{path.name}',
                  'sha256': actual_sha, 'bytes': path.stat().st_size,
                  'restart_policy': 'manual' if kind == 'updater' else 'drain-and-restart'}
              if kind in ('desktop', 'browser', 'updater'):
                  plan['min_agent_version'] = minimum_agent_version
              components.append(plan)
          if found != expected:
              raise SystemExit(f'component bundle matrix incomplete: missing={sorted(expected - found)}, unexpected={sorted(found - expected)}')
          for os_name, arch in (('linux', 'amd64'), ('linux', 'arm64'), ('windows', 'amd64')):
              archive = root / f'remote-connect-mcp-agent-{version}-{os_name}-{arch}.zip'
              checksum = archive.with_name(archive.name + '.sha256')
              if not archive.is_file() or not checksum.is_file() or checksum.read_text(encoding='utf-8').split()[0].lower() != hashlib.sha256(archive.read_bytes()).hexdigest():
                  raise SystemExit(f'missing or mismatched command-agent bundle: {archive.name}')
          target = root / f'remote-connect-mcp-manifest-{version}.json'
          target.write_text(json.dumps({'version': version, 'components': components}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Sign Agent assets
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: |
            release/*.zip
            release/*.zip.sha256
            release/*.tar.gz
            release/*.tar.gz.sha256
            release/*.spdx.json
            release/remote-connect-mcp-manifest-*.json
          release-signing-artifacts: false
      - name: Publish GitHub Agent release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release -maxdepth 1 -type f \( -name '*.zip' -o -name '*.zip.sha256' -o -name '*.tar.gz' -o -name '*.tar.gz.sha256' -o -name '*.spdx.json' -o -name '*.sigstore.json' -o -name 'remote-connect-mcp-manifest-*.json' \) -print0 | sort -z)
          ((${#assets[@]} > 0))
          args=("${RELEASE_TAG}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "Agent ${RELEASE_VERSION}" --generate-notes)
          if [[ "${RELEASE_PRERELEASE}" == 'true' ]]; then args+=(--prerelease); fi
          gh release create "${args[@]}"
          marker="agent-published-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${marker}" -f "sha=${GITHUB_SHA}" >/dev/null
          {
            echo "### Agent ${RELEASE_VERSION}"
            echo "Source: \`${GITHUB_SHA}\`"
            echo "Published tag: \`${RELEASE_TAG}\`"
            echo "Manifest SHA-256: \`$(sha256sum "release/remote-connect-mcp-manifest-${RELEASE_VERSION}.json" | cut -d' ' -f1)\`"
            echo 'Release assets are published; fleet completion requires Center campaign and machine-version verification.'
          } >> "${GITHUB_STEP_SUMMARY}"

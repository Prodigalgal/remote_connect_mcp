name: Browser runtime check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  browser-runtime:
    name: Camoufox navigation gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/browser-runtime/package-lock.json
      - name: Install and smoke Camoufox
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/browser-worker.mjs
          node --check scripts/smoke-browser-runtime.mjs
          node --test scripts/browser-worker.test.mjs
          npm ci --prefix scripts/browser-runtime --no-audit --no-fund
          export CAMOUFOX_INSTALL_DIR="${RUNNER_TEMP}/camoufox"
          node scripts/browser-runtime/node_modules/@camoufox/camoufox/dist/__main__.js fetch || node scripts/browser-runtime/node_modules/@camoufox/camoufox/dist/__main__.js fetch
          export CAMOUFOX_EXECUTABLE_PATH="$(node scripts/browser-runtime/resolve-executable.mjs)"
          test -x "$CAMOUFOX_EXECUTABLE_PATH"
          cp scripts/browser-worker.mjs scripts/browser-runtime/browser-worker.mjs
          node scripts/smoke-browser-runtime.mjs

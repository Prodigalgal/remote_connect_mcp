name: Console Component Release

on:
  push:
    branches: [main]
    tags: ["console-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Console version, for example v0.1.32"
        required: true
        type: string
      prerelease:
        description: "Publish as a prerelease and promote staging"
        required: true
        default: false
        type: boolean
      deploy:
        description: "Promote the Console image through GitOps"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: rcm-console-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  changes:
    name: Detect Console changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" || "${REF_TYPE}" == "tag" ]]; then
            echo 'changed=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ -z "${BEFORE}" || "${BEFORE}" =~ ^0+$ ]]; then files="$(git ls-files)"; else files="$(git diff --name-only "${BEFORE}" "${SHA}")"; fi
          if printf '%s\n' "${files}" | grep -Eq '^(web/|\.github/workflows/react-console-release.yml$)'; then
            echo 'changed=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'changed=false' >> "${GITHUB_OUTPUT}"
          fi

  prepare:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.coordinates.outputs.version }}
      tag: ${{ steps.coordinates.outputs.tag }}
      prerelease: ${{ steps.coordinates.outputs.prerelease }}
      deploy: ${{ steps.coordinates.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve Console coordinates
        id: coordinates
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_DEPLOY: ${{ inputs.deploy }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION#console-}"
            prerelease="${INPUT_PRERELEASE:-false}"
            deploy="${INPUT_DEPLOY:-true}"
          elif [[ "${REF_TYPE}" == "tag" && "${REF_NAME}" == console-v* ]]; then
            version="${REF_NAME#console-}"
            prerelease=false
            deploy=true
          else
            version="v0.0.0-console.${RUN_NUMBER}"
            prerelease=true
            deploy=true
          fi
          [[ "${version}" =~ ^v[0-9A-Za-z][0-9A-Za-z._+-]{0,127}$ ]] || {
            echo 'Console version must start with v and contain only release-safe characters' >&2
            exit 2
          }
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=console-${version}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "deploy=${deploy}" >> "${GITHUB_OUTPUT}"

  console-test:
    name: React Console build gate
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v10.15.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build Console
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build

  image:
    name: Publish Console image
    needs: [prepare, console-test]
    if: needs.prepare.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Console image
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${IMAGE_OWNER,,}"
          tag="console-${RELEASE_VERSION}"
          tags=(--tag "ghcr.io/${owner}/remote-connect-mcp-console:${tag}")
          if [[ "${RELEASE_PRERELEASE}" != 'true' ]]; then tags+=(--tag "ghcr.io/${owner}/remote-connect-mcp-console:latest"); fi
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg RCM_CI_BUILD=true \
            --file web/Dockerfile "${tags[@]}" --provenance=true --sbom=true --push web

  gitops-deploy:
    name: Promote Console through GitOps
    needs: [prepare, image]
    if: needs.prepare.outputs.deploy == 'true' && vars.RCM_GITOPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      GITOPS_REPOSITORY: ${{ secrets.RCM_GITOPS_REPOSITORY }}
      GITOPS_SSH_KEY: ${{ secrets.RCM_GITOPS_SSH_KEY }}
    steps:
      - name: Configure GitHub-only GitOps deploy key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITOPS_REPOSITORY}" && test -n "${GITOPS_SSH_KEY}"
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${GITOPS_SSH_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          ssh-keyscan -t ed25519 github.com >> "${HOME}/.ssh/known_hosts"
          chmod 644 "${HOME}/.ssh/known_hosts"
      - name: Resolve Console image digest
        id: image
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="${IMAGE_OWNER,,}"
          token="$(curl --fail --silent --show-error --user "${GHCR_USER}:${GHCR_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${owner}/remote-connect-mcp-console:pull" | jq --raw-output --exit-status '.token')"
          digest="$(curl --fail --silent --show-error --head \
            --header "Authorization: Bearer ${token}" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${owner}/remote-connect-mcp-console/manifests/console-${RELEASE_VERSION}" \
            | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" { print $2; exit }')"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Checkout private GitOps repository
        shell: bash
        run: git clone --depth 1 --branch main "git@github.com:${GITOPS_REPOSITORY}.git" gitops
      - name: Pin only Console manifest
        env:
          CONSOLE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_PRERELEASE}" == 'true' ]]; then overlay='remote-connect-mcp-java-staging'; else overlay='remote-connect-mcp-java-production'; fi
          path="gitops/${overlay}/console.yaml"
          test -f "${path}"
          CONSOLE_DIGEST="${CONSOLE_DIGEST}" python3 - "${path}" <<'PY'
          import os
          import pathlib
          import re
          path = pathlib.Path(__import__('sys').argv[1])
          digest = os.environ['CONSOLE_DIGEST']
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r'(image:\s*ghcr\.io/prodigalgal/remote-connect-mcp-console@)sha256:[0-9a-f]{64}')
          text, count = pattern.subn(r'\1' + digest, text)
          if count != 1: raise SystemExit(f'expected one Console image reference, found {count}')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git -C gitops diff --check
          git -C gitops diff -- "${overlay}/console.yaml"
      - name: Commit and push Console promotion
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_PRERELEASE}" == 'true' ]]; then overlay='remote-connect-mcp-java-staging'; else overlay='remote-connect-mcp-java-production'; fi
          git -C gitops config user.name 'remote-connect-mcp-actions[bot]'
          git -C gitops config user.email 'remote-connect-mcp-actions[bot]@users.noreply.github.com'
          git -C gitops add "${overlay}/console.yaml"
          if git -C gitops diff --cached --quiet; then echo 'Console overlay already points at this release.'; exit 0; fi
          git -C gitops commit -m "chore(remote-connect-mcp): promote console ${RELEASE_VERSION}"
          git -C gitops push origin HEAD:main

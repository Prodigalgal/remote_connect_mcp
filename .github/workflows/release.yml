name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 ./...
      - run: go vet ./...

  package:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            suffix: .exe
            archive: zip
          - goos: windows
            goarch: arm64
            suffix: .exe
            archive: zip
          - goos: linux
            goarch: amd64
            suffix: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            suffix: ""
            archive: tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and package
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          SUFFIX: ${{ matrix.suffix }}
          ARCHIVE: ${{ matrix.archive }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="remote-connect-mcp-${VERSION}-${GOOS}-${GOARCH}"
          root="package/${name}"
          mkdir -p "${root}/dist/${GOOS}-${GOARCH}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "${root}/dist/${GOOS}-${GOARCH}/remote-connect-mcp-center${SUFFIX}" ./cmd/remote-connect-mcp-center
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "${root}/dist/${GOOS}-${GOARCH}/remote-connect-mcp-agent${SUFFIX}" ./cmd/remote-connect-mcp-agent
          cp README.md LICENSE NOTICE "${root}/"
          mkdir -p "${root}/deploy/systemd"
          cp deploy/systemd/remote-connect-mcp-agent.service deploy/systemd/agent.env.example scripts/install-agent.sh "${root}/deploy/systemd/"
          chmod +x "${root}/deploy/systemd/install-agent.sh"
          if [[ "${ARCHIVE}" == "zip" ]]; then
            (cd package && zip -qr "../${name}.zip" "${name}")
            sha256sum "${name}.zip" > "${name}.zip.sha256"
          else
            tar -C package -czf "${name}.tar.gz" "${name}"
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remote-connect-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            remote-connect-mcp-*.zip
            remote-connect-mcp-*.zip.sha256
            remote-connect-mcp-*.tar.gz
            remote-connect-mcp-*.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag

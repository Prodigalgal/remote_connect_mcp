<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Remote Connect Artifact</title>
  <style>
    body{font:14px system-ui,sans-serif;margin:16px;color:#172033;background:#fff}
    main{display:grid;gap:10px}header{font-weight:600;word-break:break-word}
    small{color:#65718a}img,video,iframe{max-width:100%;max-height:70vh;border:1px solid #d9dfeb;border-radius:6px}
    pre{white-space:pre-wrap;max-height:60vh;overflow:auto;background:#f5f7fb;padding:10px;border-radius:6px}
    a{color:#1769e0}button{padding:6px 10px;border:1px solid #b7c2d6;border-radius:5px;background:#f5f7fb;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <header id="name">Artifact</header>
    <small id="meta"></small>
    <section id="preview"></section>
    <a id="download" rel="noreferrer" download>Download</a>
    <button id="save" hidden>Save to ChatGPT</button>
    <button id="library" hidden>Save to Library</button>
  </main>
  <script>
  (function(){
    let latestResult=null;
    const output=()=>window.openai&&window.openai.toolOutput?window.openai.toolOutput:null;
    const pick=()=>{const result=latestResult||{};const o=result.structuredContent||result.structured_content||output()||result||{};return o.file||o.artifact||o;};
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const readPreview=async(url,limit)=>{
      const response=await fetch(url,{credentials:'omit',headers:{Range:'bytes=0-'+(limit-1)}});
      if(!response.ok&&response.status!==206)throw new Error('preview request failed');
      if(!response.body)return (await response.text()).slice(0,limit);
      const reader=response.body.getReader(),parts=[],decoder=new TextDecoder();let total=0;
      try{while(total<limit){const next=await reader.read();if(next.done)break;const remaining=limit-total;const chunk=next.value.slice(0,remaining);parts.push(decoder.decode(chunk,{stream:total+chunk.length<limit}));total+=chunk.length;if(chunk.length<next.value.length||total>=limit){try{await reader.cancel()}catch(error){}break;}}}
      finally{try{reader.releaseLock()}catch(error){}}
      return parts.join('');
    };
    const previewHandlers=[];
    const registerPreviewHandler=(name,matches,render)=>previewHandlers.push({name,matches,render});
    registerPreviewHandler('image',mime=>mime.startsWith('image/'),(p,url,name)=>{p.innerHTML='<img alt="'+esc(name)+'" src="'+esc(url)+'">';});
    registerPreviewHandler('pdf',mime=>mime==='application/pdf',(p,url,name)=>{p.innerHTML='<iframe title="'+esc(name)+'" src="'+esc(url)+'" style="width:100%;height:70vh"></iframe>';});
    registerPreviewHandler('video',mime=>mime.startsWith('video/'),(p,url)=>{p.innerHTML='<video controls src="'+esc(url)+'"></video>';});
    registerPreviewHandler('audio',mime=>mime.startsWith('audio/'),(p,url)=>{p.innerHTML='<audio controls src="'+esc(url)+'"></audio>';});
    registerPreviewHandler('diff', (mime,name)=>mime.includes('diff')||/\.(diff|patch)$/i.test(name), (p,url)=>{readPreview(url,262144).then(t=>{p.innerHTML='<pre class="artifact-diff">'+esc(t)+'</pre>';}).catch(()=>{p.innerHTML='<small>Diff preview unavailable; use download.</small>';});});
    registerPreviewHandler('text', (mime,name)=>mime.startsWith('text/')||mime.includes('json')||mime.includes('xml')||mime.includes('csv')||mime.includes('javascript')||mime.includes('yaml')||mime.includes('markdown')||/\.(md|markdown|csv|json|ya?ml|toml|ini|log|txt|xml|html?|css|js|ts|java|go|py|sh|ps1|sql)$/i.test(name), (p,url)=>{readPreview(url,262144).then(t=>{p.innerHTML='<pre>'+esc(t)+'</pre>';}).catch(()=>{p.innerHTML='<small>Preview unavailable; use download.</small>';});});
    registerPreviewHandler('office', (mime,name)=>mime.includes('officedocument')||mime.includes('msword')||mime.includes('vnd.ms-')||/\.(docx?|xlsx?|pptx?|odt|ods|odp|rtf)$/i.test(name), (p,url,name)=>{p.innerHTML='<small>Office 文档为下载后本地打开，避免在 MCP App 中执行或解压不可信内容：'+esc(name)+'</small>';});
    registerPreviewHandler('archive', (mime,name)=>mime.includes('zip')||mime.includes('gzip')||mime.includes('x-7z')||mime.includes('x-rar')||mime.includes('x-tar')||/\.(zip|7z|rar|tar|gz|tgz)$/i.test(name), (p,url,name)=>{p.innerHTML='<small>压缩包为下载后本地打开，MCP App 不会自动解压：'+esc(name)+'</small>';});
    window.rcmArtifactViewer={registerPreviewHandler,previewHandlers};
    const resultHandler=result=>{latestResult=result&&result.params?result.params:result;render();};
    const render=()=>{
      const f=pick(),url=f.preview_url||f.download_url||f.url||'',downloadUrl=f.download_url||f.url||url;
      const name=f.file_name||f.name||'artifact',mime=(f.mime_type||f.mime||'application/octet-stream').toLowerCase();
      document.querySelector('#name').textContent=name;
      document.querySelector('#meta').textContent=[mime,f.bytes?Number(f.bytes).toLocaleString()+' bytes':'',f.sha256?'sha256 '+f.sha256:'',f.artifact_id?'artifact '+f.artifact_id:''].filter(Boolean).join(' · ');
      const p=document.querySelector('#preview');p.replaceChildren();const safe=esc(url);
      if(!url){p.innerHTML='<small>Artifact is not ready yet. Call artifact_read again after task_wait reports delivered.</small>';return;}
      const handler=previewHandlers.find(value=>value.matches(mime,name));
      if(handler)handler.render(p,url,name,mime);else p.innerHTML='<small>This file type is download-only. The original file remains available for download.</small>';
      const a=document.querySelector('#download');a.href=downloadUrl;a.download=name;a.textContent='Download '+name;
      const save=document.querySelector('#save'),library=document.querySelector('#library'),canUpload=!!(window.openai&&typeof window.openai.uploadFile==='function');
      const upload=async(target,libraryMode)=>{target.disabled=true;try{const response=await fetch(downloadUrl,{credentials:'omit'});if(!response.ok)throw new Error('download failed');const blob=await response.blob();const file=new File([blob],name,{type:mime});const uploaded=libraryMode?await window.openai.uploadFile(file,{library:true}):await window.openai.uploadFile(file);const id=uploaded&&(uploaded.id||uploaded.file_id||uploaded.fileId);target.textContent=libraryMode?'Saved to Library':'Saved to ChatGPT';if(id)document.querySelector('#meta').textContent+=' · file '+id;}catch(error){target.textContent=libraryMode?'Library save failed':'Save failed';}finally{target.disabled=false;}};
      save.hidden=!downloadUrl||!canUpload;save.onclick=()=>upload(save,false);
      library.hidden=!downloadUrl||!canUpload;library.onclick=()=>upload(library,true);
    };
    render();
    window.addEventListener('message',event=>{const data=event&&event.data;if(data&&data.method==='ui/notifications/tool-result')resultHandler(data.params||{});});
    const app=window.mcpApp||window.mcp||window.app;
    if(app&&typeof app.addEventListener==='function')app.addEventListener('toolresult',resultHandler);
    if(app&&typeof app.ontoolresult==='function')app.ontoolresult=resultHandler;
    const notify=window.openai&&window.openai.onToolResult?window.openai.onToolResult:window.openai&&window.openai.onToolOutput;
    if(typeof notify==='function')notify(resultHandler);
  })();
  </script>
</body>
</html>

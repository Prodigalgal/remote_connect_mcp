spring.application.name=remote-connect-mcp-center
server.shutdown=graceful
server.forward-headers-strategy=framework
spring.threads.virtual.enabled=true
spring.mvc.async.request-timeout=60000
spring.jackson.property-naming-strategy=SNAKE_CASE
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
rcm.persistence.mode=${RCM_CENTER_PERSISTENCE_MODE:memory}
rcm.persistence.require-durable=${RCM_CENTER_REQUIRE_DURABLE_STORAGE:false}
rcm.artifact.store=${RCM_CENTER_ARTIFACT_STORE:filesystem}
rcm.artifact.root=${RCM_CENTER_ARTIFACT_ROOT:}
rcm.artifact.http.base-url=${RCM_CENTER_ARTIFACT_HTTP_BASE_URL:}
rcm.artifact.http.token=${RCM_CENTER_ARTIFACT_HTTP_TOKEN:}
rcm.artifact.http.timeout-seconds=${RCM_CENTER_ARTIFACT_HTTP_TIMEOUT_SECONDS:30}
rcm.database.url=${RCM_CENTER_DATABASE_URL:}
rcm.version=${RCM_CENTER_VERSION:dev}
rcm.agent-upgrades.enabled=${RCM_CENTER_AGENT_UPGRADES_ENABLED:true}
rcm.release-base-url=${RCM_CENTER_RELEASE_BASE_URL:${REMOTE_CONNECT_MCP_CENTER_RELEASE_BASE_URL:https://github.com/Prodigalgal/remote_connect_mcp/releases/download}}
rcm.releases-api-url=${RCM_CENTER_RELEASES_API_URL:${REMOTE_CONNECT_MCP_CENTER_RELEASES_API_URL:https://api.github.com/repos/Prodigalgal/remote_connect_mcp/releases}}
rcm.agent-websocket.enabled=${RCM_CENTER_AGENT_WEBSOCKET_ENABLED:false}

databaseChangeLog:
  - changeSet:
      id: 015-mcp-principals
      author: remote-connect-mcp
      labels: principals
      contexts: postgres
      runInTransaction: true
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - createTable:
            tableName: rcm_principal
            columns:
              - column:
                  name: principal_id
                  type: varchar(180)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: kind
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: display_name
                  type: varchar(256)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_rcm_principal_status
            tableName: rcm_principal
            columns:
              - column:
                  name: status
              - column:
                  name: updated_at
        - createTable:
            tableName: rcm_mcp_token
            columns:
              - column:
                  name: token_id
                  type: varchar(180)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: principal_id
                  type: varchar(180)
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: char(64)
                  constraints:
                    nullable: false
              - column:
                  name: display_name
                  type: varchar(256)
              - column:
                  name: scope_json
                  type: jsonb
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamptz
              - column:
                  name: revoked_at
                  type: timestamptz
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: last_used_at
                  type: timestamptz
        - addForeignKeyConstraint:
            baseTableName: rcm_mcp_token
            baseColumnNames: principal_id
            constraintName: fk_rcm_mcp_token_principal
            referencedTableName: rcm_principal
            referencedColumnNames: principal_id
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: rcm_mcp_token
            columnNames: token_hash
            constraintName: uq_rcm_mcp_token_hash
        - createIndex:
            indexName: idx_rcm_mcp_token_principal
            tableName: rcm_mcp_token
            columns:
              - column:
                  name: principal_id
              - column:
                  name: revoked_at
              - column:
                  name: expires_at
        - addColumn:
            tableName: rcm_task
            columns:
              - column:
                  name: principal_id
                  type: varchar(180)
              - column:
                  name: connection_id
                  type: varchar(256)
        - update:
            tableName: rcm_task
            columns:
              - column:
                  name: principal_id
                  value: owner/shared-domain
              - column:
                  name: connection_id
                  value: legacy
        - addNotNullConstraint:
            tableName: rcm_task
            columnName: principal_id
            columnDataType: varchar(180)
        # Use explicit PostgreSQL timestamp syntax here.  Liquibase's
        # valueDate serializer can emit an unquoted ISO literal for
        # timestamptz, which PostgreSQL parses as arithmetic and rejects.
        - sql:
            sql: |
              INSERT INTO rcm_principal
                (principal_id, kind, display_name, status, created_at, updated_at)
              VALUES
                ('owner/shared-domain', 'shared-compat', 'Compatibility shared domain', 'active',
                 TIMESTAMPTZ '1970-01-01 00:00:00+00', TIMESTAMPTZ '1970-01-01 00:00:00+00');
        - addForeignKeyConstraint:
            baseTableName: rcm_task
            baseColumnNames: principal_id
            constraintName: fk_rcm_task_principal
            referencedTableName: rcm_principal
            referencedColumnNames: principal_id
            onDelete: RESTRICT
        - dropUniqueConstraint:
            tableName: rcm_task
            constraintName: uq_rcm_task_idempotency
        - addUniqueConstraint:
            tableName: rcm_task
            columnNames: agent_id, principal_id, idempotency_key
            constraintName: uq_rcm_task_principal_idempotency
        - createIndex:
            indexName: idx_rcm_task_principal_created
            tableName: rcm_task
            columns:
              - column:
                  name: principal_id
              - column:
                  name: created_at
        - createIndex:
            indexName: idx_rcm_task_connection
            tableName: rcm_task
            columns:
              - column:
                  name: connection_id
              - column:
                  name: created_at
      rollback:
        - dropIndex:
            indexName: idx_rcm_task_connection
            tableName: rcm_task
        - dropIndex:
            indexName: idx_rcm_task_principal_created
            tableName: rcm_task
        - dropUniqueConstraint:
            tableName: rcm_task
            constraintName: uq_rcm_task_principal_idempotency
        - addUniqueConstraint:
            tableName: rcm_task
            columnNames: agent_id, idempotency_key
            constraintName: uq_rcm_task_idempotency
        - dropForeignKeyConstraint:
            baseTableName: rcm_task
            constraintName: fk_rcm_task_principal
        - dropColumn:
            tableName: rcm_task
            columnName: connection_id
        - dropColumn:
            tableName: rcm_task
            columnName: principal_id
        - dropIndex:
            indexName: idx_rcm_mcp_token_principal
            tableName: rcm_mcp_token
        - dropUniqueConstraint:
            tableName: rcm_mcp_token
            constraintName: uq_rcm_mcp_token_hash
        - dropForeignKeyConstraint:
            baseTableName: rcm_mcp_token
            constraintName: fk_rcm_mcp_token_principal
        - dropTable:
            tableName: rcm_mcp_token
        - dropIndex:
            indexName: idx_rcm_principal_status
            tableName: rcm_principal
        - dropTable:
            tableName: rcm_principal

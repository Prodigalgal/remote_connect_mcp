server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Resolve the Center service at request time. Kubernetes DNS can briefly
  # lag a rollout; a literal proxy_pass makes nginx exit during that window
  # instead of starting and retrying when the upstream becomes available.
  resolver 10.96.0.10 valid=30s ipv6=off;
  resolver_timeout 5s;
  set $rcm_center_upstream http://remote-connect-mcp-java-center.remote-connect-mcp.svc.cluster.local:8080;

  location /api/ {
    proxy_pass $rcm_center_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Remote Control 文件</title>
  <style>
    :root{color-scheme:light dark;--bg:#f5f5f5;--fg:#202123;--muted:#6b6b6b;--border:#ddd}
    @media(prefers-color-scheme:dark){:root{--bg:#292929;--fg:#eee;--muted:#aaa;--border:#444}}
    :root[data-theme=dark]{--bg:#292929;--fg:#eee;--muted:#aaa;--border:#444}
    :root[data-theme=light]{--bg:#f5f5f5;--fg:#202123;--muted:#6b6b6b;--border:#ddd}
    *{box-sizing:border-box}body{font:14px system-ui,sans-serif;margin:8px;color:var(--fg);background:transparent}
    main{display:flex;align-items:center;gap:14px;max-width:640px;padding:14px 16px;border:1px solid var(--border);border-radius:16px;background:var(--bg)}
    #icon{font-size:24px;color:#238fe8}.info{min-width:0;flex:1}header{font-weight:600;overflow-wrap:anywhere}small{display:block;color:var(--muted);margin-top:4px}
    .actions{display:flex;flex-wrap:wrap;gap:8px}a,button{color:inherit;font:inherit;font-size:12px;border:1px solid var(--border);background:transparent;border-radius:8px;padding:6px 9px;text-decoration:none;cursor:pointer}
    [hidden]{display:none!important}button:disabled{opacity:.6;cursor:default}@media(max-width:480px){main{flex-wrap:wrap}.actions{margin-left:38px}}
  </style>
</head>
<body>
  <main aria-live="polite">
    <span id="icon" aria-hidden="true">▤</span>
    <div class="info"><header id="name">文件</header><small id="meta">等待文件结果</small></div>
    <div class="actions">
      <a id="open" target="_blank" rel="noreferrer" hidden>打开</a>
      <a id="download" rel="noreferrer" download hidden>下载</a>
      <button id="save" hidden>保存到 ChatGPT</button>
    </div>
  </main>
  <script>
  (function(){
    const el=id=>document.getElementById(id),host=()=>window.openai||{};
    let latestResult=null,generation=0;
    const savedFiles=new Map(),persisted=new Set(),uploads=new Set();
    const notifyHeight=()=>{const bridge=host();if(typeof bridge.notifyIntrinsicHeight==='function')bridge.notifyIntrinsicHeight(document.documentElement.scrollHeight||110);};
    const fetchFile=async(download)=>{
      const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),60000);
      try{
        const response=await fetch(download,{credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer',signal:controller.signal});
        if(!response.ok)throw new Error('下载失败，请刷新文件链接');
        if(!response.body?.getReader){const blob=await response.blob();if(blob.size>32*1024*1024)throw new Error('请直接下载大文件');return blob;}
        const reader=response.body.getReader(),parts=[];let size=0;
        try{while(true){const {value,done}=await reader.read();if(done)break;size+=value.byteLength;if(size>32*1024*1024)throw new Error('请直接下载大文件');parts.push(value);}}
        finally{await reader.cancel().catch(()=>{});}
        return new Blob(parts,{type:response.headers?.get('Content-Type')||'application/octet-stream'});
      }finally{clearTimeout(timer);}
    };
    const url=value=>{try{const parsed=new URL(String(value||''));return ['https:','http:'].includes(parsed.protocol)?parsed.href:'';}catch{return '';}};
    const typeLabel=file=>{
      const mime=String(file.mime_type||'').toLowerCase(),name=String(file.file_name||'').toLowerCase();
      if(mime.includes('word')||/\.(docx?|odt|rtf)$/.test(name))return 'Word';
      if(mime.includes('spreadsheet')||mime.includes('excel')||/\.(xlsx?|ods)$/.test(name))return 'Excel';
      if(mime.includes('presentation')||mime.includes('powerpoint')||/\.(pptx?|odp)$/.test(name))return 'PowerPoint';
      if(mime==='application/pdf'||name.endsWith('.pdf'))return 'PDF';
      if(mime.startsWith('image/'))return '图片';if(mime.startsWith('audio/'))return '音频';if(mime.startsWith('video/'))return '视频';
      if(mime.startsWith('text/'))return '文本';return '文件';
    };
    const render=async()=>{
      const current=++generation,bridge=host();
      const theme=bridge.theme;if(theme==='light'||theme==='dark')document.documentElement.dataset.theme=theme;
      const result=latestResult||bridge.toolOutput||{},data=result.structuredContent||result.structured_content||result;
      const file=data.file||{},transfer=data.transfer||{},task=data.task||{},status=transfer.status||task.status||'';
      for(const id of ['open','download','save']){el(id).hidden=true;el(id).removeAttribute('href');}
      el('name').textContent=file.file_name||transfer.file_name||'文件';
      const failure=data.error||transfer.error||task.error;
      if(failure||['failed','canceled','expired'].includes(status)){
        el('meta').textContent=typeof failure==='string'?failure:failure?.message||'文件任务未完成：'+status;return;
      }
      if(!['ready','delivered','completed'].includes(status)){
        el('meta').textContent=task.id?'文件准备中，可通过 task_read 查询 '+task.id:'等待文件结果';return;
      }
      // RCM artifact_id is never passed to a host API as a ChatGPT file_id.
      let download=url(file.download_url);
      if(!download&&file.file_id&&typeof bridge.getFileDownloadUrl==='function'){
        try{download=url((await bridge.getFileDownloadUrl({fileId:file.file_id}))?.downloadUrl);}catch{}
      }
      if(current!==generation)return;
      el('meta').textContent=[typeLabel(file),Number.isFinite(file.bytes)?Number(file.bytes).toLocaleString()+' 字节':''].filter(Boolean).join(' · ');
      if(!download){el('meta').textContent='文件链接不可用，可通过 artifact(operation=read) 获取新链接';return;}
      const open=el('open');open.href=url(file.preview_url)||download;open.hidden=false;
      const link=el('download');link.href=download;link.download=file.file_name||'artifact';link.hidden=false;
      const save=el('save');save.textContent='保存到 ChatGPT';save.disabled=false;
      // Registration is an explicit user action. It is not an output-file API
      // and does not promise an automatic native conversation attachment card.
      save.hidden=typeof bridge.uploadFile!=='function'||!Number.isFinite(file.bytes)||file.bytes>32*1024*1024;
      const identity=file.artifact_id||file.file_id||download;
      const remembered=bridge.widgetState?.privateContent?.savedFiles?.[identity];
      if(remembered?.file_id){savedFiles.set(identity,remembered);persisted.add(identity);}
      if(persisted.has(identity)){save.textContent='已添加到 ChatGPT';save.disabled=true;}
      else if(savedFiles.has(identity))save.textContent='重试保存文件引用';
      if(uploads.has(identity)){save.textContent='正在添加…';save.disabled=true;}
      save.onclick=async()=>{
        if(persisted.has(identity)||uploads.has(identity))return;
        uploads.add(identity);
        save.disabled=true;
        try{
          let hostFile=savedFiles.get(identity);
          if(!hostFile){
          const blob=await fetchFile(download);
          if(blob.size!==file.bytes)throw new Error('文件内容不完整，请刷新链接后重试');
          if(file.sha256&&window.crypto?.subtle){
            const digest=Array.from(new Uint8Array(await window.crypto.subtle.digest('SHA-256',await blob.arrayBuffer())),value=>value.toString(16).padStart(2,'0')).join('');
            if(digest!==file.sha256.toLowerCase())throw new Error('文件校验失败');
          }
          const uploaded=await bridge.uploadFile(new File([blob],file.file_name||'artifact',{type:file.mime_type||blob.type}));
          if(typeof uploaded?.fileId!=='string'||!uploaded.fileId)throw new Error('ChatGPT 未返回有效文件标识');
          hostFile={file_id:uploaded.fileId,file_name:file.file_name||'artifact',mime_type:file.mime_type||blob.type};
          savedFiles.set(identity,hostFile);
          while(savedFiles.size>32){const oldest=savedFiles.keys().next().value;savedFiles.delete(oldest);persisted.delete(oldest);}
          }
          // Keep the actual host file reference across re-renders. The signed
          // RCM URL is deliberately not stored in model/widget state.
          if(typeof bridge.setWidgetState==='function')await bridge.setWidgetState({
            modelContent:{file:hostFile,status:'available_in_chatgpt'},
            privateContent:{savedFiles:Object.fromEntries(savedFiles)},imageIds:[]
          });
          persisted.add(identity);
          if(current===generation){save.textContent='已添加到 ChatGPT';el('meta').textContent=typeLabel(file)+' · 已添加到 ChatGPT';}
        }catch(error){if(current===generation)save.textContent=savedFiles.has(identity)?'文件已上传，重试保存引用':error.message||'保存失败';}
        finally{uploads.delete(identity);if(current===generation)save.disabled=persisted.has(identity);notifyHeight();}
      };
      notifyHeight();
    };
    window.addEventListener('message',event=>{if(event.source&&event.source!==window.parent)return;const message=event.data;if(message?.method==='ui/notifications/tool-result'){latestResult=message.params||{};render();}});
    window.addEventListener('openai:set_globals',()=>render());
    render();
  })();
  </script>
</body>
</html>

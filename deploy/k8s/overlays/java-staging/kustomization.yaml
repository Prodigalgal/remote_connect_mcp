apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Side-by-side Java migration target.  It intentionally lives in the
# existing remote-connect-mcp namespace so the cluster Gateway/TLS setup can
# be reused, while every workload/service name remains distinct from the Go
# Center until the cutover is accepted.
resources:
  - postgres.yaml
  - migration-job.yaml
  - center.yaml
  - console.yaml
  - routes.yaml

apiVersion: v1
kind: Service
metadata:
  name: remote-connect-mcp-java-console
  namespace: remote-connect-mcp
  labels:
    app.kubernetes.io/name: remote-connect-mcp-java-console
    app.kubernetes.io/part-of: remote-connect-mcp
spec:
  selector:
    app.kubernetes.io/name: remote-connect-mcp-java-console
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remote-connect-mcp-java-console
  namespace: remote-connect-mcp
  labels:
    app.kubernetes.io/name: remote-connect-mcp-java-console
    app.kubernetes.io/part-of: remote-connect-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: remote-connect-mcp-java-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remote-connect-mcp-java-console
        app.kubernetes.io/part-of: remote-connect-mcp
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        infra.mnnu/node-class: core-public
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: ghcr.io/prodigalgal/remote-connect-mcp-console:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-run
          emptyDir:
            sizeLimit: 16Mi

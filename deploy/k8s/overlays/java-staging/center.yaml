apiVersion: v1
kind: Service
metadata:
  name: remote-connect-mcp-java-center
  namespace: remote-connect-mcp
  labels:
    app.kubernetes.io/name: remote-connect-mcp-java-center
    app.kubernetes.io/part-of: remote-connect-mcp
spec:
  selector:
    app.kubernetes.io/name: remote-connect-mcp-java-center
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remote-connect-mcp-java-center
  namespace: remote-connect-mcp
  labels:
    app.kubernetes.io/name: remote-connect-mcp-java-center
    app.kubernetes.io/part-of: remote-connect-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: remote-connect-mcp-java-center
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remote-connect-mcp-java-center
        app.kubernetes.io/part-of: remote-connect-mcp
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        infra.mnnu/node-class: core-public
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: center
          image: ghcr.io/prodigalgal/remote-connect-mcp-center-java:v0.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RCM_CENTER_PERSISTENCE_MODE
              value: postgres
            - name: RCM_CENTER_REQUIRE_DURABLE_STORAGE
              value: "true"
            - name: RCM_CENTER_LIQUIBASE_ENABLED
              value: "false"
            - name: RCM_CENTER_VERSION
              value: v0.1.1
            - name: RCM_CENTER_AGENT_UPGRADES_ENABLED
              value: "true"
            - name: RCM_CENTER_RELEASE_BASE_URL
              value: https://github.com/Prodigalgal/remote_connect_mcp/releases/download
            - name: RCM_CENTER_RELEASE_TAG_PREFIX
              value: java-
            - name: RCM_CENTER_AGENT_WEBSOCKET_ENABLED
              value: "true"
            - name: RCM_CENTER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: remote-connect-mcp-java-secrets
                  key: database-url
            - name: RCM_CENTER_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: remote-connect-mcp-java-secrets
                  key: database-username
            - name: RCM_CENTER_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: remote-connect-mcp-java-secrets
                  key: database-password
            - name: REMOTE_CONNECT_MCP_CENTER_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: remote-connect-mcp-java-secrets
                  key: mcp-token
            - name: REMOTE_CONNECT_MCP_CENTER_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: remote-connect-mcp-java-secrets
                  key: admin-token
          readinessProbe:
            httpGet:
              path: /api/v1/readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi

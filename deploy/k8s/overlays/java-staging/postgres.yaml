apiVersion: v1
kind: Service
metadata:
  name: remote-connect-mcp-java-postgres
  namespace: remote-connect-mcp
  labels:
    app.kubernetes.io/name: remote-connect-mcp-java-postgres
    app.kubernetes.io/part-of: remote-connect-mcp
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: remote-connect-mcp-java-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: remote-connect-mcp-java-postgres
  namespace: remote-connect-mcp
  labels:
    app.kubernetes.io/name: remote-connect-mcp-java-postgres
    app.kubernetes.io/part-of: remote-connect-mcp
    app.kubernetes.io/component: database
spec:
  serviceName: remote-connect-mcp-java-postgres
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: remote-connect-mcp-java-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remote-connect-mcp-java-postgres
        app.kubernetes.io/part-of: remote-connect-mcp
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        infra.mnnu/node-class: core-public
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: remote_connect_mcp
            - name: POSTGRES_USER
              value: rcm
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: remote-connect-mcp-java-postgres
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "rcm", "-d", "remote_connect_mcp"]
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "rcm", "-d", "remote_connect_mcp"]
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "rcm", "-d", "remote_connect_mcp"]
            failureThreshold: 6
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app.kubernetes.io/name: remote-connect-mcp-java-postgres
          app.kubernetes.io/part-of: remote-connect-mcp
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 10Gi

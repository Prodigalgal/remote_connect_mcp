apiVersion: apps/v1
kind: Deployment
metadata:
  name: remote-connect-mcp-java-center
  namespace: remote-connect-mcp
spec:
  template:
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        infra.mnnu/node-class: core-public
      containers:
        - name: center
          env:
            - name: RCM_CENTER_VERSION
              value: v0.1.0
            - name: RCM_CENTER_AGENT_AUTO_UPGRADE_INCLUDE_PRERELEASE
              value: "false"
            - name: RCM_CENTER_AGENT_WEBSOCKET_ENABLED
              value: "true"
            - name: RCM_CENTER_OAUTH_ENABLED
              value: "true"
            - name: RCM_CENTER_OAUTH_ISSUER
              # The private GitOps overlay replaces example.invalid with the
              # real Center hostname before Argo sync; never commit that
              # private domain to this public application repository.
              value: https://remote-connect-mcp-center.example.invalid
            - name: RCM_CENTER_OAUTH_RESOURCE
              value: https://remote-connect-mcp-center.example.invalid

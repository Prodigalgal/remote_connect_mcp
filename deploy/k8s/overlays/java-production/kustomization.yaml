apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production overlay for the Java Center/React migration candidate.  The
# sibling java-center directory is a base; secrets remain external to Git.
resources:
  - ../../java-center

images:
  - name: ghcr.io/replace-me/remote-control-mcp-center
    newName: ghcr.io/prodigalgal/remote-control-mcp-center
    newTag: v0.1.0
  - name: ghcr.io/replace-me/remote-control-mcp-console
    newName: ghcr.io/prodigalgal/remote-control-mcp-console
    newTag: v0.1.0

patches:
  - path: center-production-patch.yaml
  - path: console-production-patch.yaml
  - path: route-production-patch.yaml

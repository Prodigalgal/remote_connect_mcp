apiVersion: apps/v1
kind: Deployment
metadata:
  name: remote-connect-mcp-center
  namespace: remote-connect-mcp
  labels:
    app.kubernetes.io/name: remote-connect-mcp-center
    app.kubernetes.io/part-of: remote-connect-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: remote-connect-mcp-center
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remote-connect-mcp-center
        app.kubernetes.io/part-of: remote-connect-mcp
    spec:
      nodeSelector:
        infra.mnnu/node-class: core-public
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: center
          image: docker.io/speedproxy/remote-connect-mcp-center:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: REMOTE_CONNECT_MCP_CENTER_HOST
              value: 0.0.0.0
            - name: REMOTE_CONNECT_MCP_CENTER_PORT
              value: "8080"
            - name: REMOTE_CONNECT_MCP_CENTER_STATE_DIR
              value: /var/lib/remote-connect-mcp-center
            - name: REMOTE_CONNECT_MCP_CENTER_CONSOLE_HOSTNAME
              value: console.example.invalid
            - name: REMOTE_CONNECT_MCP_CENTER_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: remote-connect-mcp-secrets
                  key: mcp-token
            - name: REMOTE_CONNECT_MCP_CENTER_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: remote-connect-mcp-secrets
                  key: admin-token
            - name: REMOTE_CONNECT_MCP_CENTER_ENROLLMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: remote-connect-mcp-secrets
                  key: enrollment-token
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: state
              mountPath: /var/lib/remote-connect-mcp-center
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: remote-connect-mcp-center-state

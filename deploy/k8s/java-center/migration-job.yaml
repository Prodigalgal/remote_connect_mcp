apiVersion: batch/v1
kind: Job
metadata:
  name: remote-connect-mcp-java-migration
  namespace: remote-connect-mcp
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    app.kubernetes.io/name: remote-connect-mcp-java-migration
    app.kubernetes.io/part-of: remote-connect-mcp
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remote-connect-mcp-java-migration
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: liquibase
          image: ghcr.io/replace-me/remote-connect-mcp-center-java:0.1.0
          command: ["/opt/rcm-center/rcm-center", "--migrate"]
          env:
            - name: RCM_CENTER_PERSISTENCE_MODE
              value: postgres
            - name: RCM_CENTER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: remote-connect-mcp-java-secrets
                  key: database-url
            - name: RCM_CENTER_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: remote-connect-mcp-java-secrets
                  key: database-username
            - name: RCM_CENTER_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: remote-connect-mcp-java-secrets
                  key: database-password
            - name: RCM_CENTER_LIQUIBASE_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi

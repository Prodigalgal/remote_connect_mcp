apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: remote-control-mcp-center
  namespace: remote-control-mcp
  labels:
    app.kubernetes.io/name: remote-control-mcp-center
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: mnnu-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    # Keep the established gateway alias for MCP clients.  Production overlays
    # may reuse the existing remote-control-mcp-* records without creating a
    # second DNS name just because the implementation is Java.
    - remote-control-mcp-gateway.example.invalid
    - remote-control-mcp-agent.example.invalid
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: remote-control-mcp-center
          port: 8080
      timeouts:
        request: 0s
        backendRequest: 0s

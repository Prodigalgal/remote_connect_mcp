apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: remote-connect-mcp-java-center
  namespace: remote-connect-mcp
  labels:
    app.kubernetes.io/name: remote-connect-mcp-java-center
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: mnnu-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - remote-connect-mcp-mcp.example.invalid
    - remote-connect-mcp-agent.example.invalid
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: remote-connect-mcp-java-center
          port: 8080
      timeouts:
        request: 0s
        backendRequest: 0s

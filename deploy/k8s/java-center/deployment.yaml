apiVersion: apps/v1
kind: Deployment
metadata:
  name: remote-connect-mcp-java-center
  namespace: remote-connect-mcp
  labels:
    app.kubernetes.io/name: remote-connect-mcp-java-center
    app.kubernetes.io/part-of: remote-connect-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: remote-connect-mcp-java-center
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remote-connect-mcp-java-center
        app.kubernetes.io/part-of: remote-connect-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: center
          image: ghcr.io/replace-me/remote-connect-mcp-center-java:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RCM_CENTER_PERSISTENCE_MODE
              value: postgres
            - name: RCM_CENTER_REQUIRE_DURABLE_STORAGE
              value: "true"
            - name: RCM_CENTER_ARTIFACT_STORE
              value: filesystem
            - name: RCM_CENTER_ARTIFACT_ROOT
              value: /var/lib/remote-connect-mcp-center/artifacts
            - name: RCM_CENTER_TRANSFER_SPOOL_ROOT
              value: /var/lib/remote-connect-mcp-center/artifacts/.transfer-spool
            # Artifact retention is independent from the short-lived signed
            # URL handed to the Web client.  An offline Agent can therefore
            # wait for days without keeping a browser URL valid for days.
            - name: RCM_CENTER_ARTIFACT_RETENTION_SECONDS
              value: "604800"
            - name: RCM_CENTER_ARTIFACT_URL_TTL_SECONDS
              value: "900"
            # Public origin used in signed artifact URLs and MCP Apps CSP
            # metadata. Production overlays must replace this example value
            # with the stable HTTPS Center hostname.
            - name: RCM_CENTER_PUBLIC_BASE_URL
              value: https://remote-connect-mcp-center.example.invalid
            - name: RCM_CENTER_TRANSFER_MAX_CONCURRENT
              value: "4"
            - name: RCM_CENTER_TRANSFER_MAX_PER_PRINCIPAL
              value: "2"
            - name: RCM_CENTER_TRANSFER_MAX_PER_MACHINE
              value: "1"
            - name: RCM_CENTER_TRANSFER_MAX_SPOOL_BYTES
              value: "8589934592"
            # Abort a body that makes no read progress while preserving the
            # separate 30-minute absolute transfer lifetime.
            - name: RCM_CENTER_TRANSFER_STALL_TIMEOUT_SECONDS
              value: "120"
            - name: RCM_CENTER_LIQUIBASE_ENABLED
              value: "false"
            - name: RCM_CENTER_VERSION
              value: 0.1.0
            - name: RCM_CENTER_AGENT_UPGRADES_ENABLED
              value: "true"
            - name: RCM_CENTER_RELEASE_BASE_URL
              value: https://github.com/Prodigalgal/remote_connect_mcp/releases/download
            - name: RCM_CENTER_RELEASES_API_URL
              value: https://api.github.com/repos/Prodigalgal/remote_connect_mcp/releases
            - name: RCM_CENTER_RELEASE_TAG_PREFIX
              value: java-
            - name: RCM_CENTER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: remote-connect-mcp-java-secrets
                  key: database-url
            - name: RCM_CENTER_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: remote-connect-mcp-java-secrets
                  key: database-username
            - name: RCM_CENTER_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: remote-connect-mcp-java-secrets
                  key: database-password
            - name: REMOTE_CONNECT_MCP_CENTER_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: remote-connect-mcp-java-secrets
                  key: mcp-token
            - name: REMOTE_CONNECT_MCP_CENTER_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: remote-connect-mcp-java-secrets
                  key: admin-token
            - name: REMOTE_CONNECT_MCP_CENTER_ARTIFACT_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: remote-connect-mcp-java-secrets
                  key: artifact-signing-secret
            # Optional rolling-rotation key. Keep the previous key until the
            # longest signed URL TTL has elapsed, then remove it.
            - name: REMOTE_CONNECT_MCP_CENTER_ARTIFACT_SIGNING_SECRET_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: remote-connect-mcp-java-secrets
                  key: artifact-signing-secret-previous
                  optional: true
            - name: REMOTE_CONNECT_MCP_CENTER_ARTIFACT_SIGNING_KID
              valueFrom:
                secretKeyRef:
                  name: remote-connect-mcp-java-secrets
                  key: artifact-signing-kid
                  optional: true
            - name: REMOTE_CONNECT_MCP_CENTER_ARTIFACT_SIGNING_KID_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: remote-connect-mcp-java-secrets
                  key: artifact-signing-kid-previous
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/v1/readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: artifacts
              mountPath: /var/lib/remote-connect-mcp-center/artifacts
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: artifacts
          persistentVolumeClaim:
            claimName: remote-connect-mcp-java-artifacts
